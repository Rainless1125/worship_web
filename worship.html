<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Worship web">
<meta name="application-name" content="Worship web">
<title>Worship web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 8 種經文字體（中文字型會依實際用到的字分段下載，不會一次載入全部） -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Cactus+Classical+Serif&family=Chiron+Sung+HK:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&family=Iansui&family=Noto+Sans+TC:wght@400;500&family=Chiron+GoRound+TC:wght@400;600&family=Huninn&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  /* 銀河星空（WebGL） */
  .galaxy {
    position: fixed; inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .galaxy canvas {
    position: absolute; inset: 0;
    display: block;
    width: 100%; height: 100%;
  }
  .no-galaxy .galaxy { display: none; }
  /* 黃色光束（WebGL） */
  .light-rays {
    position: fixed; inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .light-rays canvas {
    position: absolute; inset: 0;
    display: block;
    width: 100%; height: 100%;
  }
  .no-lightrays .light-rays { display: none; }
  /* 光點粒子（WebGL） */
  .particles {
    position: fixed; inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .particles canvas {
    position: absolute; inset: 0;
    display: block;
    width: 100%; height: 100%;
  }
  /* 灑落亮點畫布 */
  /* 音樂等化器畫布 */
  #eq {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  #audioBtn[aria-pressed="true"] .dock-dot { opacity: 1; }
  #audioBtn[aria-pressed="true"] .dock-face { color: #ffd36a; }
  #sparkles {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  /* 十字架區塊：靠上方置中 */
  .cross-wrap {
    position: absolute;
    top: 12vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(28vw, 200px);
    aspect-ratio: 3 / 4;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  /* 背後的柔和光暈 */
  .halo {
    position: absolute;
    left: 50%; top: 27%;
    width: 220%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 220, 110, 0.45) 0%,
      rgba(255, 190, 40, 0.18) 25%,
      rgba(255, 170, 0, 0.06) 45%,
      transparent 65%);
    animation: breathe 8s ease-in-out infinite;
  }
  /* 十字架本體 */
  .cross {
    position: relative;
    width: 100%; height: 100%;
    animation: glow 8s ease-in-out infinite;
  }
  .cross svg {
    width: 100%; height: 100%;
    overflow: visible;
    display: block;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.94); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.1); }
  }
  @keyframes glow {
    0%, 100% { filter: brightness(0.9); }
    50%      { filter: brightness(1.18); }
  }
  /* 十字架外層光暈跟著呼吸放大縮小 */
  .breath-glow {
    animation: glow-layer 8s ease-in-out infinite;
  }
  @keyframes glow-layer {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  /* 地平線微光 */
  .horizon {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 45vh;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 60% at 50% 100%,
        rgba(255, 190, 90, 0.28) 0%,
        rgba(255, 150, 60, 0.12) 35%,
        rgba(180, 90, 40, 0.03) 65%,
        transparent 100%),
      radial-gradient(ellipse 120% 25% at 50% 100%,
        rgba(255, 210, 140, 0.12) 0%,
        transparent 100%);
    animation: horizon-breath 16s ease-in-out infinite;
  }
  .horizon::after {           /* 最底部一道細細的亮線 */
    content: "";
    position: absolute;
    left: 15%; right: 15%; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 220, 160, 0.35), transparent);
    filter: blur(1px);
  }
  @keyframes horizon-breath {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1; }
  }
  /* 經文區 */
  .verse {
    position: absolute;
    left: 50%;
    top: calc(12vh + min(28vw, 200px) * 4 / 3 + 7vh);
    transform: translateX(-50%);
    width: min(88vw, 760px);
    z-index: 3;
    text-align: center;
    font-family: var(--verse-font, "Noto Serif TC"), "Songti TC", "PMingLiU", "MingLiU", serif;
    color: #fff8e6;
    opacity: 0;
    transition: opacity 1.8s ease, filter 1.8s ease, transform 1.8s ease;
    filter: blur(4px);
    pointer-events: none;
  }
  .verse.quick { transition-duration: 0.6s; }
  .verse.show {
    opacity: 1;
    filter: blur(0);
  }
  .verse-text {
    font-size: calc(clamp(18px, 2.3vw, 28px) * var(--verse-scale, 1));
    font-weight: 400;
    line-height: 1.9;
    letter-spacing: 0.08em;
    text-shadow:
      0 0 12px rgba(255, 220, 140, 0.35),
      0 0 30px rgba(255, 190, 80, 0.15);
  }
  /* 每個語句（以標點分段）是一個不可拆的區塊，只在標點後換行 */
  .verse-text .phrase {
    display: inline-block;
  }
  .verse-text {
    text-wrap: balance;      /* 讓每行長度盡量平均 */
  }
  .verse-ref {
    margin-top: 1.1em;
    font-size: calc(clamp(14px, 1.5vw, 18px) * var(--verse-scale, 1));
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #ffd36a;
    text-shadow: 0 0 10px rgba(255, 200, 80, 0.45);
  }
  .verse-ref::before,
  .verse-ref::after {
    content: "";
    display: inline-block;
    vertical-align: middle;
    width: 2.2em; height: 1px;
    margin: 0 0.9em;
    background: linear-gradient(90deg, transparent, rgba(255, 211, 106, 0.7));
  }
  .verse-ref::after {
    background: linear-gradient(90deg, rgba(255, 211, 106, 0.7), transparent);
  }

  /* ===== 底部 Dock（移植自 React Bits Dock，改為純 JavaScript 版） ===== */
  .dock {
    /* 深色主題色票，強調色改為與十字架呼應的金色 */
    --dock-panel: rgba(38, 35, 46, 0.66);
    --dock-panel-edge: rgba(255, 255, 255, 0.08);
    --dock-panel-highlight: rgba(255, 255, 255, 0.07);
    --dock-panel-shadow: 0 22px 44px -20px rgba(0, 0, 0, 0.8), 0 6px 16px -8px rgba(0, 0, 0, 0.5);
    --dock-tile: linear-gradient(180deg, #3a3644 0%, #27242f 100%);
    --dock-tile-edge: rgba(255, 255, 255, 0.07);
    --dock-tile-highlight: rgba(255, 255, 255, 0.12);
    --dock-tile-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.7);
    --dock-ink: #f4f4f5;
    --dock-label: #2a2731;
    --dock-label-ink: #f4f4f5;
    --dock-dot: #ffd36a;
    --dock-separator: rgba(255, 255, 255, 0.12);
    --dock-press: brightness(0.75);
    --dock-accent: #e0a82e;
    --dock-base: 50px;
    --dock-thickness: 68px;
    --dock-gap: 10px;
    --dock-pad: 9px;
    --dock-reach: 20px;
    --dock-round: 0.5;

    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: flex-end;
    gap: var(--dock-gap);
    box-sizing: border-box;
    height: var(--dock-thickness);
    padding: var(--dock-pad);
    border-radius: calc(var(--dock-base) * var(--dock-round) * 0.5 + var(--dock-pad));
    background: var(--dock-panel);
    box-shadow:
      inset 0 0 0 1px var(--dock-panel-edge),
      inset 0 1px 0 var(--dock-panel-highlight),
      var(--dock-panel-shadow);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
            backdrop-filter: blur(20px) saturate(1.6);
    touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    transition: opacity 0.6s ease;
  }
  /* 放大時上方的感應區，避免游標移到放大的圖示上就失去感應 */
  .dock::before {
    content: "";
    position: absolute;
    z-index: -1;
    left: 0; right: 0;
    bottom: 100%;
    height: calc(var(--dock-reach) + 8px);
    display: none;
  }
  .dock:hover::before { display: block; }
  /* 一段時間沒動作就隱藏 Dock 與游標 */
  .idle .dock { opacity: 0; pointer-events: none; }

  .dock-item {
    position: relative;
    flex: none;
    width: var(--dock-base);
    height: var(--dock-base);
    margin: 0; padding: 0; border: 0;
    background: none;
    color: var(--dock-ink);
    font: inherit;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
            user-select: none;
  }
  .dock-item[hidden] { display: none; }
  .dock-item:hover, .dock-item:focus-visible { z-index: 1; }
  .dock-tile {
    position: absolute;
    top: 0; left: 0;
    width: var(--dock-base);
    height: var(--dock-base);
    transform-origin: 0 0;
    pointer-events: none;
  }
  .dock-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: calc(var(--dock-base) * var(--dock-round) * 0.5);
    background: var(--dock-tile);
    box-shadow:
      inset 0 0 0 1px var(--dock-tile-edge),
      inset 0 1px 0 var(--dock-tile-highlight),
      var(--dock-tile-shadow);
    font-size: calc(var(--dock-base) * 0.44);
    line-height: 1;
    transition: filter 0.2s ease, color 0.3s ease;
  }
  .dock-face svg { width: 1em; height: 1em; }
  .dock-face .glyph-a {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-size: 0.82em;
    letter-spacing: -0.02em;
  }
  .dock-face .glyph-a.small { font-size: 0.62em; }
  .dock-face .glyph-sign { font-size: 0.6em; margin-left: 0.05em; }
  .dock-item:active .dock-face { filter: var(--dock-press); transition-duration: 0s; }
  .dock-item:focus-visible .dock-face { outline: 2px solid var(--dock-accent); outline-offset: 3px; }

  /* 啟用中的功能：圖示轉金色＋下方亮點（像 macOS 開啟中的 App） */
  .dock-dot {
    position: absolute;
    left: 50%;
    top: calc(100% + max(var(--dock-pad) / 2, 5px) - 2px);
    width: 4px; height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: var(--dock-dot);
    box-shadow: 0 0 6px rgba(255, 211, 106, 0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #shuffleBtn[aria-pressed="true"] .dock-dot,
  #fxBtn[aria-expanded="true"] .dock-dot,
  .wake-btn:not(.off) .dock-dot,
  .is-fullscreen #fsBtn .dock-dot { opacity: 1; }
  #shuffleBtn[aria-pressed="true"] .dock-face,
  #fxBtn[aria-expanded="true"] .dock-face,
  .wake-btn:not(.off) .dock-face,
  .is-fullscreen #fsBtn .dock-face { color: #ffd36a; }

  .dock-separator {
    flex: none;
    align-self: center;
    width: 1px;
    height: calc(var(--dock-base) * 0.72);
    border-radius: 1px;
    background: var(--dock-separator);
  }

  /* 滑過時的文字提示 */
  .dock-label {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translate(-50%, 4px);
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--dock-label);
    color: var(--dock-label-ink);
    box-shadow: inset 0 0 0 1px var(--dock-panel-edge), 0 8px 20px -8px rgba(0, 0, 0, 0.35);
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .dock-item:focus-visible .dock-label { opacity: 1; transform: translate(-50%, 0); }
  @media (hover: hover) {
    .dock-item:hover .dock-label { opacity: 1; transform: translate(-50%, 0); }
  }
  .dock-item[data-hop] .dock-label { opacity: 0; }
  .fx-open .dock-label { display: none; }

  /* 全螢幕／防休眠圖示切換 */
  #fsBtn .icon-exit { display: none; }
  .is-fullscreen #fsBtn .icon-enter { display: none; }
  .is-fullscreen #fsBtn .icon-exit { display: block; }
  .idle { cursor: none; }
  .wake-btn .icon-off { display: none; }
  .wake-btn.off .icon-on { display: none; }
  .wake-btn.off .icon-off { display: block; }
  /* 狀態提示 */
  .toast {
    position: fixed;
    left: 50%; bottom: 112px;
    transform: translate(-50%, 10px);
    z-index: 11;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(20, 16, 6, 0.85);
    border: 1px solid rgba(255, 211, 106, 0.35);
    color: #fff3d0;
    font-size: 14px;
    letter-spacing: 0.05em;
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* ===== macOS 玻璃選單（設定） ===== */
  .mac-menu {
    --menu-bg: rgba(40, 37, 47, 0.82);
    --menu-edge: rgba(255, 255, 255, 0.13);
    --menu-ink: #f4f4f5;
    --menu-muted: rgba(244, 244, 245, 0.45);
    --menu-accent: #b8862a;
    position: fixed;
    left: 0; top: 0;
    z-index: 20;
    min-width: 232px;
    padding: 5px;
    border-radius: 10px;
    background: var(--menu-bg);
    box-shadow:
      inset 0 0 0 1px var(--menu-edge),
      0 18px 40px -12px rgba(0, 0, 0, 0.65),
      0 3px 10px rgba(0, 0, 0, 0.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
            backdrop-filter: blur(24px) saturate(1.8);
    color: var(--menu-ink);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 13.5px;
    line-height: 1;
    visibility: hidden;
    opacity: 0;
    transform: scale(0.82);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    outline: none;
  }
  .mac-menu.open {
    visibility: visible;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.16s ease-out, transform 0.34s cubic-bezier(0.2, 1.25, 0.4, 1), visibility 0s;
  }
  .mac-menu.sub { min-width: 168px; transform: scale(0.94); }
  .mac-menu.sub.open { transform: scale(1); transition-duration: 0.12s, 0.22s, 0s; }
  .mac-menu.covered { visibility: hidden !important; }
  /* 主選單下方指向設定按鈕的小尖角 */
  .mac-menu .tail {
    position: absolute;
    top: 100%;
    left: var(--tail-x, 50%);
    width: 18px; height: 9px;
    margin-left: -9px;
    overflow: hidden;
  }
  .mac-menu .tail::before {
    content: "";
    position: absolute;
    left: 50%; top: -8px;
    width: 13px; height: 13px;
    margin-left: -6.5px;
    transform: rotate(45deg);
    border-radius: 2px;
    background: rgba(40, 37, 47, 0.95);
    box-shadow: inset -1px -1px 0 var(--menu-edge);
  }
  .mm-head {
    display: flex;
    justify-content: space-between;
    padding: 7px 10px 5px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--menu-muted);
  }
  .mm-sep { height: 1px; margin: 5px 10px; background: rgba(255, 255, 255, 0.1); }
  .mm-row {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    height: 26px;
    margin: 0;
    padding: 0 10px 0 6px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    white-space: nowrap;
    cursor: default;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .mm-row[hidden] { display: none; }
  .mm-row:hover, .mm-row:focus-visible, .mm-row[data-active] {
    background: var(--menu-accent);
    color: #fff;
  }
  .mm-check { flex: none; width: 16px; display: flex; justify-content: center; color: #ffd36a; }
  .mm-check svg { width: 12px; height: 12px; }
  .mm-row:hover .mm-check, .mm-row:focus-visible .mm-check, .mm-row[data-active] .mm-check { color: #fff; }
  .mm-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .mm-meta { flex: none; margin-left: 18px; color: var(--menu-muted); font-size: 12.5px; }
  .mm-row:hover .mm-meta, .mm-row:focus-visible .mm-meta, .mm-row[data-active] .mm-meta { color: rgba(255, 255, 255, 0.78); }
  .mm-chevron { flex: none; margin-left: 4px; color: var(--menu-muted); display: flex; }
  .mm-chevron svg { width: 10px; height: 10px; }
  .mm-row:hover .mm-chevron, .mm-row:focus-visible .mm-chevron, .mm-row[data-active] .mm-chevron { color: #fff; }
  .mm-font .mm-text { font-size: 15px; }
  /* 觸控裝置：列高加大，比較好點 */
  @media (pointer: coarse) {
    .mm-row { height: 36px; font-size: 15px; }
    .mm-font .mm-text { font-size: 17px; }
  }

  /* 特效關閉時的樣式 */
  .no-horizon .horizon { display: none; }
  .no-bokeh .particles { display: none; }

  #nosleepVideo {
    position: fixed; left: 0; top: 0;
    width: 1px; height: 1px;
    opacity: 0.01;
    pointer-events: none;
  }
  @media (max-width: 420px) {
    .toast { bottom: 104px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .halo, .cross, .breath-glow, .horizon { animation: none; }
  }
</style>
</head>
<body>
  <div class="horizon" aria-hidden="true"></div>
  <div class="galaxy" id="galaxy" aria-hidden="true"><canvas></canvas></div>
  <div class="light-rays" id="lightRays" aria-hidden="true"><canvas></canvas></div>
  <div class="particles" id="particles" aria-hidden="true"><canvas></canvas></div>
  <canvas id="sparkles"></canvas>
  <canvas id="eq"></canvas>

  <div class="cross-wrap" aria-label="發光的十字架">
    <div class="halo"></div>
    <div class="cross">
      <!-- 單一路徑繪製的十字架，沒有拼接縫 -->
      <svg viewBox="0 0 300 400" aria-hidden="true">
        <defs>
          <path id="crossShape" d="M137,0 H163 V96 H264 V122 H163 V400 H137 V122 H36 V96 H137 Z"/>
          <!-- 以交叉點為中心的放射漸層：中心最亮，往四端轉成金色 -->
          <radialGradient id="bodyGrad" gradientUnits="userSpaceOnUse" cx="150" cy="109" r="300">
            <stop offset="0"    stop-color="#ffffff"/>
            <stop offset="0.12" stop-color="#fffbe8"/>
            <stop offset="0.35" stop-color="#ffeaa0"/>
            <stop offset="0.7"  stop-color="#ffd050"/>
            <stop offset="1"    stop-color="#f5b520"/>
          </radialGradient>
          <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="28"/>
          </filter>
          <filter id="glowMid" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="9"/>
          </filter>
          <filter id="glowTight" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
          <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="0.6"/>
          </filter>
          <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0"   stop-color="#fffef5" stop-opacity="0.95"/>
            <stop offset="0.3" stop-color="#ffe9a0" stop-opacity="0.45"/>
            <stop offset="1"   stop-color="#ffc030" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- 外層大範圍金色光暈 -->

<script>
// 使用者設定：特效開關與經文字體大小（存在瀏覽器裡，下次打開仍保留）
// 預設：開啟天降光束、銀河星空、地平線微光；關閉光點粒子、流星
window.worshipFx = { lightrays: true, galaxy: true, bokeh: false, meteors: false, horizon: true, eqBars: true, eqReact: true, eqStyle: 'wave' };
(() => {
  const KEY = 'worship-settings';
  const fx = window.worshipFx;
  let scale = 1.3;          // 預設經文字體大小 130%
  // 經文字體選項：[代號, 顯示名稱, CSS 字體名稱]
  const FONTS = [
    ['noto-serif', '思源宋體',   '"Noto Serif TC"'],
    ['cactus',     '仙人掌明體', '"Cactus Classical Serif"'],
    ['chiron-sung','昭源宋體',   '"Chiron Sung HK"'],
    ['wenkai',     '霞鶩文楷',   '"LXGW WenKai TC"'],
    ['iansui',     '芫荽',       '"Iansui"'],
    ['noto-sans',  '思源黑體',   '"Noto Sans TC"'],
    ['goround',    '昭源甜圓',   '"Chiron GoRound TC"'],
    ['huninn',     '粉圓',       '"Huninn"']
  ];
  let font = 'goround';     // 預設經文字體：昭源甜圓
  const MIN = 0.7, MAX = 1.8, STEP = 0.1;
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (saved.fx) Object.keys(fx).forEach(k => { if (typeof saved.fx[k] === typeof fx[k]) fx[k] = saved.fx[k]; });
    if (typeof saved.scale === 'number') scale = Math.min(MAX, Math.max(MIN, saved.scale));
    if (FONTS.some(f => f[0] === saved.font)) font = saved.font;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ fx, scale, font })); } catch (e) {} };

  const body = document.body;
  const applyFx = () => Object.keys(fx).forEach(k => body.classList.toggle('no-' + k, !fx[k]));
  const applyScale = () => document.documentElement.style.setProperty('--verse-scale', scale.toFixed(2));
  const applyFont = () => {
    const f = FONTS.find(x => x[0] === font);
    document.documentElement.style.setProperty('--verse-font', f[2]);
  };
  applyFx(); applyScale(); applyFont();

  const toast = msg => window.worshipToast && window.worshipToast(msg);

  // 經文字體放大／縮小
  function changeFont(dir) {
    const next = Math.round((scale + dir * STEP) * 10) / 10;
    if (next < MIN || next > MAX) { toast(dir > 0 ? '已是最大字體' : '已是最小字體'); return; }
    scale = next; applyScale(); save();
    toast('經文字體 ' + Math.round(scale * 100) + '%');
  }
  document.getElementById('fontUp').addEventListener('click', () => changeFont(1));
  document.getElementById('fontDown').addEventListener('click', () => changeFont(-1));
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '+' || e.key === '=') changeFont(1);
    if (e.key === '-' || e.key === '_') changeFont(-1);
  });

  // ===== macOS 玻璃選單 =====
  const menu = document.getElementById('fxPanel');
  const sub = document.getElementById('fontMenu');
  const mainList = document.getElementById('mmMain');
  const subList = document.getElementById('mmFont');
  const fxBtn = document.getElementById('fxBtn');
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 8.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHEVRON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3.5L10.5 8 6 12.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const BACK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3.5L5.5 8 10 12.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const FX_ITEMS = [['lightrays', '天降光束'], ['bokeh', '光點粒子'], ['galaxy', '銀河星空'], ['meteors', '流星'], ['horizon', '地平線微光']];

  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  function row({ text, meta, chevron, checked, role = 'menuitem', onClick, cls }) {
    const b = el('button', 'mm-row' + (cls ? ' ' + cls : ''));
    b.type = 'button';
    b.tabIndex = -1;
    b.setAttribute('role', role);
    b.append(el('span', 'mm-check'), el('span', 'mm-text'));
    b.querySelector('.mm-text').textContent = text;
    if (meta != null) { const m = el('span', 'mm-meta'); m.textContent = meta; b.append(m); }
    if (chevron) b.append(el('span', 'mm-chevron', CHEVRON));
    if (checked !== undefined) setCheck(b, checked);
    b.addEventListener('click', e => { e.stopPropagation(); onClick && onClick(b, e); });
    return b;
  }
  function setCheck(b, on) {
    b.querySelector('.mm-check').innerHTML = on ? CHECK : '';
    b.setAttribute('aria-checked', String(!!on));
  }
  const fontName = () => FONTS.find(f => f[0] === font)[1];

  // 主選單內容
  const sizeHead = el('div', 'mm-head');
  sizeHead.innerHTML = '<span>經文字體</span><span id="mmSize"></span>';
  const fontRow = row({ text: '字體', meta: '', chevron: true, onClick: (b, e) => toggleSub(e.detail === 0) });
  fontRow.setAttribute('aria-haspopup', 'menu');
  const upRow = row({ text: '放大字體', meta: '＋', onClick: () => { changeFont(1); refresh(); } });
  const downRow = row({ text: '縮小字體', meta: '－', onClick: () => { changeFont(-1); refresh(); } });
  const fxHead = el('div', 'mm-head', '<span>畫面特效</span>');
  const fxRows = FX_ITEMS.map(([k, label]) => {
    const r = row({ text: label, role: 'menuitemcheckbox', checked: fx[k], onClick: b => {
      fx[k] = !fx[k]; setCheck(b, fx[k]); applyFx(); save();
      if (k === 'lightrays' && fx[k] && window.worshipLightRaysWake) window.worshipLightRaysWake();
      if (k === 'galaxy' && fx[k] && window.worshipGalaxyWake) window.worshipGalaxyWake();
      if (k === 'bokeh' && fx[k] && window.worshipParticlesWake) window.worshipParticlesWake();
    } });
    r.dataset.fx = k;
    return r;
  });
  // 音樂律動（偵測電腦音樂時才有作用；不支援的裝置不顯示）
  const EQ_ITEMS = [['eqBars', '底部頻譜'], ['eqReact', '特效隨音樂律動']];
  const eqHead = el('div', 'mm-head', '<span>音樂律動</span><span>需先開啟聲波鍵</span>');
  const eqRows = EQ_ITEMS.map(([k, label]) => {
    const r = row({ text: label, role: 'menuitemcheckbox', checked: fx[k], onClick: b => { fx[k] = !fx[k]; setCheck(b, fx[k]); save(); } });
    r.dataset.fx = k;
    return r;
  });
  // 頻譜樣式（單選）：流光波形／升起的光粒
  const STYLE_ITEMS = [['wave', '流光波形'], ['rise', '升起的光粒']];
  const styleHead = el('div', 'mm-head', '<span>頻譜樣式</span>');
  const styleRows = STYLE_ITEMS.map(([key, label]) => {
    const r = row({ text: label, role: 'menuitemradio', checked: fx.eqStyle === key, onClick: () => {
      fx.eqStyle = key; save();
      styleRows.forEach(x => setCheck(x, x.dataset.style === key));
      if (!fx.eqBars) { fx.eqBars = true; setCheck(eqRows[0], true); }   // 選了樣式就順便打開頻譜
    } });
    r.dataset.style = key;
    return r;
  });
  const eqSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  mainList.append(sizeHead, fontRow, upRow, downRow, el('div', 'mm-sep'), fxHead, ...fxRows,
    ...(eqSupported ? [el('div', 'mm-sep'), eqHead, ...eqRows, styleHead, ...styleRows] : []));

  // 字體子選單（每個名稱用該字體本身顯示）
  const backRow = row({ text: '返回', onClick: () => closeSub(true) });
  backRow.querySelector('.mm-check').innerHTML = BACK;
  backRow.hidden = true;
  const fontRows = FONTS.map(([key, name, css]) => {
    const r = row({ text: name, role: 'menuitemradio', cls: 'mm-font', checked: key === font, onClick: () => {
      font = key; applyFont(); save(); refresh();
      toast('經文字體：' + name);
    } });
    r.querySelector('.mm-text').style.fontFamily = css + ', serif';
    r.dataset.font = key;
    return r;
  });
  subList.append(backRow, ...fontRows);

  function refresh() {
    document.getElementById('mmSize').textContent = Math.round(scale * 100) + '%';
    fontRow.querySelector('.mm-meta').textContent = fontName();
    fontRows.forEach(r => setCheck(r, r.dataset.font === font));
  }

  const isOpen = () => menu.classList.contains('open');
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

  function placeMain() {
    const r = fxBtn.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const w = menu.offsetWidth, h = menu.offsetHeight;
    const cx = r.left + r.width / 2;
    const left = clamp(cx - w / 2, 8, vw - 8 - w);
    const top = Math.max(8, r.top - 12 - h);
    const tail = clamp(cx - left, 18, w - 18);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.setProperty('--tail-x', tail + 'px');
    menu.style.transformOrigin = tail + 'px ' + (h + 9) + 'px';
  }

  function openMenu(keyboard) {
    refresh();
    menu.style.transition = 'none'; menu.classList.remove('open'); placeMain();
    void menu.offsetWidth; menu.style.transition = '';
    menu.classList.add('open');
    fxBtn.setAttribute('aria-expanded', 'true');
    body.classList.add('panel-open', 'fx-open');
    if (keyboard) focusRow(mainRows()[0]); else menu.focus({ preventScroll: true });
  }
  function closeMenu(restore) {
    closeSub(false);
    menu.classList.remove('open');
    fxBtn.setAttribute('aria-expanded', 'false');
    body.classList.remove('panel-open', 'fx-open');
    if (restore) fxBtn.focus({ preventScroll: true });
  }

  // 子選單：右側放得下就放右側，否則放左側，再不行（手機）就覆蓋在主選單原位
  let subTimer = 0, inline = false;
  function openSub(keyboard) {
    clearTimeout(subTimer);
    if (sub.classList.contains('open')) { if (keyboard) focusRow(fontRows.find(r => r.dataset.font === font)); return; }
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const m = menu.getBoundingClientRect(), fr = fontRow.getBoundingClientRect();
    backRow.hidden = true;
    sub.style.minWidth = '';
    const sw = sub.offsetWidth;
    let left, top, origin;
    inline = false;
    if (m.right - 4 + sw <= vw - 8) { left = m.right - 4; origin = 'left top'; }
    else if (m.left + 4 - sw >= 8) { left = m.left + 4 - sw; origin = 'right top'; }
    else { inline = true; }
    if (inline) {
      backRow.hidden = false;
      sub.style.minWidth = m.width + 'px';
      left = m.left; top = m.top; origin = 'center bottom';
      menu.classList.add('covered');
    } else {
      top = clamp(fr.top - 5, 8, vh - 8 - sub.offsetHeight);
    }
    sub.style.left = left + 'px';
    sub.style.top = top + 'px';
    sub.style.transformOrigin = origin;
    sub.classList.add('open');
    fontRow.setAttribute('data-active', '');
    fontRow.setAttribute('aria-expanded', 'true');
    if (keyboard) focusRow(inline ? backRow : fontRows.find(r => r.dataset.font === font));
  }
  function closeSub(focusBack) {
    clearTimeout(subTimer);
    if (!sub.classList.contains('open')) return;
    sub.classList.remove('open');
    menu.classList.remove('covered');
    fontRow.removeAttribute('data-active');
    fontRow.setAttribute('aria-expanded', 'false');
    if (focusBack) focusRow(fontRow);
  }
  const toggleSub = keyboard => sub.classList.contains('open') ? closeSub(keyboard) : openSub(keyboard);

  // 滑鼠滑過「字體」稍停就展開，滑到其他列就收起
  fontRow.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse') return;
    clearTimeout(subTimer); subTimer = setTimeout(() => openSub(false), 120);
  });
  [upRow, downRow, ...fxRows].forEach(r => r.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse' || inline) return;
    clearTimeout(subTimer); subTimer = setTimeout(() => closeSub(false), 220);
  }));
  sub.addEventListener('pointerenter', () => clearTimeout(subTimer));

  // 鍵盤操作：上下移動、→ 展開子選單、← / Esc 返回
  const mainRows = () => [...mainList.querySelectorAll('.mm-row')];
  const subRows = () => [...subList.querySelectorAll('.mm-row')].filter(r => !r.hidden);
  function focusRow(r) { if (r) r.focus({ preventScroll: true }); }
  function moveIn(rows, dir) {
    const at = rows.indexOf(document.activeElement);
    const next = at < 0 ? (dir > 0 ? 0 : rows.length - 1) : (at + dir + rows.length) % rows.length;
    focusRow(rows[next]);
  }
  menu.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') moveIn(mainRows(), 1);
    else if (e.key === 'ArrowUp') moveIn(mainRows(), -1);
    else if (e.key === 'ArrowRight' && document.activeElement === fontRow) openSub(true);
    else if (e.key === 'Escape' || e.key === 'Tab') closeMenu(true);
    else return;
    e.preventDefault(); e.stopPropagation();
  });
  sub.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') moveIn(subRows(), 1);
    else if (e.key === 'ArrowUp') moveIn(subRows(), -1);
    else if (e.key === 'ArrowLeft' || e.key === 'Escape') closeSub(true);
    else if (e.key === 'Tab') closeMenu(true);
    else return;
    e.preventDefault(); e.stopPropagation();
  });

  fxBtn.addEventListener('click', e => {
    e.stopPropagation();
    isOpen() ? closeMenu(false) : openMenu(e.detail === 0);
  });
  fxBtn.addEventListener('keydown', e => { if (e.key === 'ArrowUp') { e.preventDefault(); openMenu(true); } });
  document.addEventListener('pointerdown', e => {
    if (!isOpen()) return;
    if (menu.contains(e.target) || sub.contains(e.target) || fxBtn.contains(e.target)) return;
    closeMenu(false);
  }, true);
  window.addEventListener('resize', () => { if (isOpen()) closeMenu(false); });
  [menu, sub].forEach(m => m.addEventListener('dblclick', e => e.stopPropagation()));
  refresh();
})();
</script>


<script>
// 光點粒子（移植自 React Bits Particles，改為純 JavaScript 版），取代原本的暖色光斑
(() => {
  const container = document.getElementById('particles');
  const canvas = container.querySelector('canvas');
  const fxOn = () => !window.worshipFx || window.worshipFx.bokeh !== false;

  // ---- 參數（依你提供的範例；滑鼠互動與點擊爆發關閉，改由「下一則經文」觸發） ----
  const S = {
    count: 260,
    spread: 10,
    speed: 0.25,
    colors: ['#f4ff8a', '#c6ff6b', '#ffe28a'],
    size: 170,
    randomness: 0.8,
    camera: 20,
    rotate: true,
    shape: 0,            // circle
    glow: 1.6,
    twinkle: 0.9,
    depthOfField: 0,
    drift: 1,            // up：像餘燼一樣往上飄
    driftSpeed: 0.6,
    variation: 0,
    intro: true,
    soft: false,
    opacity: 1
  };
  const MAX_BURSTS = 4, DEPTH = 10, FOCAL = 1 / Math.tan((7.5 * Math.PI) / 180), NEAR = 0.1, FAR = 100;
  const INTRO_SECONDS = 1.8, BURST_SECONDS = 1.5, BURST_SPEED = 520, BURST_WIDTH = 46;

  const VERTEX = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec3 aPosition;
layout(location = 2) in vec4 aRandom;
layout(location = 3) in vec3 aColor;
uniform mat3 uRotation;
uniform vec3 uOffset;
uniform float uSpread;
uniform float uTime;
uniform float uCamera;
uniform float uAspect;
uniform vec2 uView;
uniform float uRatio;
uniform float uSize;
uniform float uRandomness;
uniform float uBlur;
uniform float uFocus;
uniform float uGlow;
uniform float uTwinkle;
uniform int uShape;
uniform int uDrift;
uniform float uTravel;
uniform vec4 uBursts[${MAX_BURSTS}];
uniform int uBurstCount;
uniform float uReveal;
out vec2 vLocal;
out float vRadius;
out float vBlur;
out float vAlpha;
out float vHalo;
out float vSeed;
out vec3 vColor;
vec3 bob(vec4 r, float t) {
  return vec3(
    sin(t * r.z + 6.28 * r.w) * mix(0.1, 1.5, r.x),
    sin(t * r.y + 6.28 * r.x) * mix(0.1, 1.5, r.w),
    sin(t * r.w + 6.28 * r.y) * mix(0.1, 1.5, r.z)
  );
}
void main() {
  vec3 pos = aPosition * uSpread;
  pos.z *= ${DEPTH.toFixed(1)};
  vec3 wobble = bob(aRandom, uTime);
  vec3 world = uRotation * pos + uOffset + wobble;
  float edge = 1.0;
  if (uDrift == 1 || uDrift == 2) {
    float span = uSpread * 2.0 + 3.0;
    float k = mod(aRandom.w * span + uOffset.y + wobble.y + (uDrift == 1 ? uTravel : -uTravel), span);
    world.y = k - span * 0.5;
    edge = smoothstep(0.0, span * 0.12, k) * smoothstep(span, span * 0.88, k);
  } else if (uDrift == 3) {
    float span = uSpread * ${DEPTH.toFixed(1)} * 2.0 + 3.0;
    float k = mod(aRandom.y * span + uOffset.z + wobble.z + uTravel, span);
    world.z = k - span * 0.5;
    edge = smoothstep(0.0, span * 0.1, k);
  }
  vec3 view = world - vec3(0.0, 0.0, uCamera);
  float dist = length(view);
  float ahead = -view.z;
  if (ahead < ${NEAR.toFixed(2)} || ahead > ${FAR.toFixed(1)}) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  edge *= smoothstep(1.0, 4.0, ahead);
  vec2 ndc = vec2(view.x * ${FOCAL.toFixed(6)} / uAspect, view.y * ${FOCAL.toFixed(6)}) / ahead;
  vec2 screen = (ndc * 0.5 + 0.5) * uView;
  vec2 shift = vec2(0.0);
  float flash = 0.0;
  for (int i = 0; i < ${MAX_BURSTS}; i++) {
    if (i >= uBurstCount) break;
    vec4 burst = uBursts[i];
    vec2 delta = screen - burst.xy;
    float reach = length(delta);
    float wave = exp(-pow((reach - burst.z * ${BURST_SPEED.toFixed(1)}) / ${BURST_WIDTH.toFixed(1)}, 2.0));
    vec2 away = reach > 0.001 ? delta / reach : vec2(0.0);
    float fade = (1.0 - burst.z) * (1.0 - burst.z) * burst.w;
    shift += away * wave * fade * 56.0 * smoothstep(0.0, 30.0, reach);
    flash += wave * fade;
  }
  screen += shift;
  float diameter = (uRandomness <= 0.0 ? uSize : uSize * (1.0 + uRandomness * (aRandom.x - 0.5)) / dist) * (1.0 + min(flash, 1.0) * 0.6);
  float device = diameter * uRatio;
  float radius = max(diameter, 1.0 / uRatio) * 0.5;
  float coverage = min(1.0, device * device);
  float blur = uBlur * max(uFocus - dist, 0.0) / max(dist, 1.0);
  float halo = uGlow > 0.0 ? radius * 2.5 + 2.0 : 0.0;
  float extent = radius * (uShape == 3 ? 1.6 : 1.0) + blur + halo + 1.5;
  float twinkle = 1.0 - uTwinkle * 0.6 * (0.5 + 0.5 * sin(uTime * (6.0 + aRandom.y * 14.0) + aRandom.w * 40.0));
  float far = smoothstep(${FAR.toFixed(1)}, ${(FAR * 0.9).toFixed(1)}, ahead);
  float focus = radius / (radius + blur);
  float reveal = clamp(uReveal * 1.6 - aRandom.z * 0.6, 0.0, 1.0);
  vLocal = aCorner * extent;
  vRadius = radius;
  vBlur = blur;
  vHalo = halo;
  vSeed = aRandom.y;
  vAlpha = min(1.0, coverage * twinkle * (1.0 + flash * 1.4)) * far * edge * max(focus, 0.35) * reveal * reveal;
  vColor = aColor;
  gl_Position = vec4((screen + aCorner * extent) / uView * 2.0 - 1.0, 0.0, 1.0);
}`;

  const FRAGMENT = `#version 300 es
precision highp float;
precision highp int;
uniform int uShape;
uniform float uGlow;
uniform float uRatio;
uniform float uTime;
uniform float uSoft;
uniform float uShimmer;
uniform float uOpacity;
in vec2 vLocal;
in float vRadius;
in float vBlur;
in float vAlpha;
in float vHalo;
in float vSeed;
in vec3 vColor;
out vec4 outColor;
float ray(vec2 q, float aa) {
  float width = 0.14 * max(0.0, 1.0 - q.x);
  return (1.0 - smoothstep(width - aa, width + aa, q.y)) * step(q.x, 1.0);
}
void main() {
  float soft = vBlur + 0.7 / uRatio + vRadius * uSoft;
  float d = length(vLocal);
  float shape;
  if (uShape == 1) {
    float box = max(abs(vLocal.x), abs(vLocal.y));
    shape = 1.0 - smoothstep(vRadius * 0.86 - soft, vRadius * 0.86 + soft, box);
  } else if (uShape == 2) {
    float edge = max(vRadius * 0.22, 0.6 / uRatio);
    shape = 1.0 - smoothstep(edge - soft, edge + soft, abs(d - vRadius * 0.8));
  } else if (uShape == 3) {
    float reach = vRadius * 1.6;
    vec2 q = abs(vLocal) / max(reach, 0.0001);
    float aa = soft / max(reach, 0.0001);
    shape = max(max(ray(q, aa), ray(q.yx, aa)), 1.0 - smoothstep(vRadius * 0.32 - soft, vRadius * 0.32 + soft, d));
  } else {
    shape = 1.0 - smoothstep(vRadius - soft, vRadius + soft, d);
  }
  float halo = vHalo > 0.0 ? exp(-d / (vHalo * 0.35)) * uGlow * 0.4 : 0.0;
  float alpha = clamp(shape + halo * (1.0 - shape), 0.0, 1.0) * vAlpha * uOpacity * (1.0 - uSoft);
  if (alpha < 0.002) discard;
  vec2 uv = vLocal / max(vRadius * 2.0, 0.0001) + 0.5;
  vec3 color = clamp(vColor + uShimmer * 0.2 * sin(uv.yxx + uTime + vSeed * 6.28), 0.0, 1.0);
  outColor = vec4(color * alpha, alpha);
}`;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
  if (!gl) { container.hidden = true; return; }
  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); return null; }
    return sh;
  }
  const vs = compile(gl.VERTEX_SHADER, VERTEX), fs = compile(gl.FRAGMENT_SHADER, FRAGMENT);
  if (!vs || !fs) { container.hidden = true; return; }
  const program = gl.createProgram();
  gl.attachShader(program, vs); gl.attachShader(program, fs); gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) { container.hidden = true; return; }
  const u = {};
  for (let n = 0, c = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); n < c; n++) {
    const info = gl.getActiveUniform(program, n);
    u[info.name.replace('[0]', '')] = gl.getUniformLocation(program, info.name);
  }

  // ---- 建立粒子資料（固定亂數種子，每次打開分布相同） ----
  const seeded = seed => { let st = seed >>> 0; return () => { st = (st + 0x6d2b79f5) >>> 0; let t = st; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const next = seeded(S.variation * 7919 + 1);
  const positions = new Float32Array(S.count * 3), randoms = new Float32Array(S.count * 4), tints = new Float32Array(S.count * 3);
  const swatches = S.colors.map(hex);
  for (let i = 0; i < S.count; i++) {
    let x, y, z, len;
    do { x = next() * 2 - 1; y = next() * 2 - 1; z = next() * 2 - 1; len = x * x + y * y + z * z; } while (len > 1 || len === 0);
    const r = Math.cbrt(next());
    positions.set([x * r, y * r, z * r], i * 3);
    randoms.set([next(), next(), next(), next()], i * 4);
    tints.set(swatches[Math.floor(next() * swatches.length)], i * 3);
  }
  const buf = data => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); return b; };
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf(new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1])));
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  [[positions, 1, 3], [randoms, 2, 4], [tints, 3, 3]].forEach(([data, loc, width]) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf(data));
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, width, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(loc, 1);
  });
  gl.bindVertexArray(null);

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const view = { width: 1, height: 1, ratio: 1 };
  const state = { clock: 0, spin: 0, travel: 0, reveal: S.intro && !reduce ? 0 : 1 };
  const bursts = [];
  const packed = new Float32Array(MAX_BURSTS * 4);
  let raf = 0, last = 0;

  function rotation() {
    const e = state.clock * 1000;
    const x = S.rotate ? Math.sin(e * 0.0002) * 0.1 : 0, y = S.rotate ? Math.cos(e * 0.0005) * 0.15 : 0, z = S.rotate ? state.spin : 0;
    const [sx, cx, sy, cy, sz, cz] = [Math.sin(x), Math.cos(x), Math.sin(y), Math.cos(y), Math.sin(z), Math.cos(z)];
    return [cy * cz + sy * sx * sz, cx * sz, -sy * cz + cy * sx * sz, -cy * sz + sy * sx * cz, cx * cz, sy * sz + cy * sx * cz, sy * cx, -sx, cy * cx];
  }

  function render() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (!fxOn()) return;
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    let n = 0;
    packed.fill(0);
    for (let i = bursts.length - 1; i >= 0 && n < MAX_BURSTS; i--, n++) packed.set([bursts[i].x, bursts[i].y, bursts[i].age / BURST_SECONDS, 1], n * 4);
    gl.useProgram(program);
    gl.bindVertexArray(vao);
    gl.uniformMatrix3fv(u.uRotation, false, rotation());
    gl.uniform3f(u.uOffset, 0, 0, -(1 - easeOut(state.reveal)) * 70);
    gl.uniform1f(u.uSpread, S.spread);
    gl.uniform1f(u.uTime, state.clock);
    gl.uniform1f(u.uCamera, S.camera);
    gl.uniform1f(u.uAspect, view.width / view.height);
    gl.uniform2f(u.uView, view.width, view.height);
    gl.uniform1f(u.uRatio, view.ratio);
    gl.uniform1f(u.uSize, S.size);
    gl.uniform1f(u.uRandomness, S.randomness);
    gl.uniform1f(u.uBlur, S.depthOfField * 14);
    gl.uniform1f(u.uFocus, S.camera + 14);
    const AG = window.worshipAudioReact && window.worshipAudioReact();
    gl.uniform1f(u.uGlow, S.glow * (AG ? 1 + AG.mid * 1.2 : 1));
    gl.uniform1f(u.uTwinkle, S.twinkle);
    gl.uniform1i(u.uShape, S.shape);
    gl.uniform1i(u.uDrift, S.drift);
    gl.uniform1f(u.uTravel, state.travel);
    gl.uniform4fv(u.uBursts, packed);
    gl.uniform1i(u.uBurstCount, n);
    gl.uniform1f(u.uReveal, state.reveal);
    gl.uniform1f(u.uSoft, S.soft ? 0.2 : 0);
    gl.uniform1f(u.uShimmer, 1);
    gl.uniform1f(u.uOpacity, S.opacity);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, S.count);
    gl.bindVertexArray(null);
  }

  function frame(now) {
    raf = 0;
    if (document.hidden) return;
    if (!fxOn()) { render(); last = 0; return; }
    const dt = last ? clamp((now - last) / 1000, 0.0005, 0.05) : 1 / 60;
    last = now;
    const motion = reduce ? 0 : 1;
    const AR = window.worshipAudioReact && window.worshipAudioReact();
    const pace = dt * S.speed * motion * (AR ? 1 + AR.level * 2.5 : 1);
    state.clock += pace;
    if (S.rotate) state.spin += pace * 0.6;
    state.travel += dt * S.driftSpeed * motion * (S.drift === 3 ? 6 : 0.9);
    for (let i = bursts.length - 1; i >= 0; i--) { bursts[i].age += dt; if (bursts[i].age >= BURST_SECONDS) bursts.splice(i, 1); }
    if (!S.intro || reduce) state.reveal = 1;
    else if (state.reveal < 1) state.reveal = Math.min(1, state.reveal + dt / INTRO_SECONDS);
    render();
    raf = requestAnimationFrame(frame);
  }
  const wake = () => { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); };

  function resize() {
    view.width = Math.max(1, window.innerWidth);
    view.height = Math.max(1, window.innerHeight);
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(view.width * ratio));
    canvas.height = Math.max(1, Math.round(view.height * ratio));
    view.ratio = canvas.width / view.width;
    render(); wake();
  }

  // 提供給「下一則經文」使用：從經文位置送出一圈光的漣漪
  window.worshipParticlesBurst = () => {
    if (reduce || !fxOn()) return;
    const verse = document.getElementById('verse').getBoundingClientRect();
    const x = verse.left + verse.width / 2;
    const y = view.height - (verse.top + verse.height / 2);   // WebGL 座標 y 由下往上
    bursts.push({ x, y, age: 0 });
    if (bursts.length > MAX_BURSTS) bursts.shift();
    wake();
  };
  // 重新開啟時再播一次「從遠處飛入」的開場
  window.worshipParticlesWake = () => { if (!reduce) state.reveal = 0; last = 0; wake(); };

  document.addEventListener('visibilitychange', () => { last = 0; wake(); });
  window.addEventListener('resize', resize);
  resize();
})();
</script>

<script>
// ===== 音樂律動：擷取電腦播放的聲音（分享系統音訊／分頁音訊），分析頻譜後驅動等化器 =====
(() => {
  const btn = document.getElementById('audioBtn');
  const canvas = document.getElementById('eq');
  const ctx = canvas.getContext('2d');
  const crossWrap = document.querySelector('.cross-wrap');
  const toast = msg => window.worshipToast && window.worshipToast(msg);
  const fx = () => window.worshipFx || {};
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  if (!supported) btn.hidden = true;     // 手機等不支援分享音訊的裝置，不顯示按鈕

  let audioCtx = null, analyser = null, stream = null, freq = null, sampleRate = 48000;
  let active = false;
  let w = 0, h = 0, dpr = 1;
  // 平滑後的各頻段強度（0～1），以及節拍偵測
  const A = { bass: 0, mid: 0, treble: 0, level: 0, beatId: 0, beatStrength: 0 };
  let bassAvg = 0, lastBeat = 0;

  // 提供給其他特效讀取：只有在偵測中、且「特效隨音樂律動」開啟時才回傳
  window.worshipAudioReact = () => (active && fx().eqReact !== false ? A : null);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function render() {
    btn.setAttribute('aria-pressed', String(active));
    const label = active ? '停止偵測音樂' : '偵測電腦播放的音樂';
    btn.setAttribute('aria-label', label);
    btn.querySelector('.dock-label').textContent = label;
    document.body.classList.toggle('audio-on', active);
  }

  async function start() {
    try {
      // Chrome／Edge 規定一定要同時要求畫面，取得後立刻停掉畫面，只留聲音
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        systemAudio: 'include',
        selfBrowserSurface: 'exclude'
      });
    } catch (e) {
      if (e && e.name === 'NotAllowedError') toast('已取消分享');
      else toast('此瀏覽器或環境不支援分享音訊');
      return;
    }
    stream.getVideoTracks().forEach(t => t.stop());
    const tracks = stream.getAudioTracks();
    if (!tracks.length) {
      toast('沒有收到聲音：請勾選「分享系統音訊」或「分享分頁音訊」');
      stream = null;
      return;
    }
    connect(new MediaStream(tracks));
    tracks[0].addEventListener('ended', stop);   // 使用者按瀏覽器的「停止分享」時
    toast('🎵 已開始偵測音樂');
  }

  function connect(mediaStream, node) {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    sampleRate = audioCtx.sampleRate;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.72;
    freq = new Uint8Array(analyser.frequencyBinCount);
    const src = node || audioCtx.createMediaStreamSource(mediaStream);
    src.connect(analyser);      // 只分析、不接到喇叭，不會重複播放或回音
    analyser._src = src;
    active = true;
    render();
  }

  function stop() {
    if (!active) return;
    active = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    if (analyser && analyser._src) { try { analyser._src.disconnect(); } catch (e) {} if (analyser._src.stop) try { analyser._src.stop(); } catch (e) {} }
    analyser = null;
    crossWrap.style.filter = '';
    motes.length = 0;
    ctx.clearRect(0, 0, w, h);
    render();
    toast('已停止偵測音樂');
  }

  btn.addEventListener('click', () => (active ? stop() : start()));

  // 頻率（Hz）→ 頻譜陣列位置；取一段頻率的平均強度
  const bin = f => Math.min(freq.length - 1, Math.max(0, Math.round(f / (sampleRate / 2) * freq.length)));
  function band(f0, f1) {
    const a = bin(f0), b = Math.max(a + 1, bin(f1));
    let sum = 0;
    for (let i = a; i < b; i++) sum += freq[i];
    return sum / (b - a) / 255;
  }
  const follow = (cur, target, up, down) => cur + (target - cur) * (target > cur ? up : down);

  // ---- 底部頻譜：先算出 64 個頻段（對數分布 40Hz～12kHz）的平滑強度 ----
  const BANDS = 64;
  const levels = new Float32Array(BANDS);
  function updateLevels() {
    for (let i = 0; i < BANDS; i++) {
      const f0 = 40 * Math.pow(300, i / BANDS), f1 = 40 * Math.pow(300, (i + 1) / BANDS);
      const v = Math.pow(band(f0, f1), 1.4) * (0.75 + i / BANDS * 0.6);   // 高頻稍微補強
      levels[i] = follow(levels[i], v, 0.5, 0.12);
    }
  }
  const baseY = () => h - Math.max(18, h * 0.035);
  const maxH = () => Math.min(h * 0.13, 110);          // 不要高到碰到經文
  const spanW = () => Math.min(w * 0.94, 1100);

  // 樣式 C：流光波形——左右對稱的平滑發光曲線，下方填淡金色
  function drawWave() {
    const base = baseY(), verseBottom = document.getElementById('verse').getBoundingClientRect().bottom;
    const n = BANDS, mh = Math.min(maxH(), Math.max(24, base - verseBottom - 10)), span = spanW(), left = w / 2 - span / 2;   // 波形不會碰到經文
    const pts = [];
    for (let k = 0; k < n * 2; k++) {
      const i = k < n ? n - 1 - k : k - n;                        // 中間低音、往兩側高音
      const env = Math.pow(Math.sin(Math.PI * (k + 0.5) / (n * 2)), 0.6);   // 兩端收細
      pts.push([left + k * span / (n * 2 - 1), base - levels[i] * mh * env]);
    }
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    };
    path();
    ctx.lineTo(left + span, base + 6); ctx.lineTo(left, base + 6); ctx.closePath();
    const fill = ctx.createLinearGradient(0, base - mh, 0, base + 6);
    fill.addColorStop(0, `rgba(255,210,100,${0.22 + A.level * 0.3})`);
    fill.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = fill; ctx.fill();
    // 外層光暈＋明亮的核心線
    path();
    ctx.shadowColor = 'rgba(255,200,80,0.9)'; ctx.shadowBlur = 16;
    ctx.strokeStyle = 'rgba(255,215,120,0.55)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.shadowBlur = 0;
    path();
    ctx.strokeStyle = 'rgba(255,248,220,0.95)'; ctx.lineWidth = 1.6; ctx.stroke();
  }

  // 樣式 E：升起的光粒——每個頻段依強度往上噴出光粒，慢慢飄升、淡出
  const motes = [];
  const MOTE = (() => {
    const s = 48, c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d'), g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(0.25, 'rgba(255,230,160,0.8)');
    g.addColorStop(0.6, 'rgba(255,195,80,0.2)'); g.addColorStop(1, 'rgba(255,180,60,0)');
    x.fillStyle = g; x.fillRect(0, 0, s, s); return c;
  })();
  const emitAcc = new Float32Array(BANDS * 2);
  function drawRise(dt) {
    const n = BANDS, base = baseY(), mh = maxH(), span = spanW(), left = w / 2 - span / 2, gap = span / (n * 2);
    // 光粒最高只飄到經文下緣，不會蓋到經文與出處
    const verseBottom = document.getElementById('verse').getBoundingClientRect().bottom;
    const room = Math.max(24, base - verseBottom - 8);
    // 從中間往兩側、左右成對輪流產生，數量上限時兩邊也會平均分配，不會偏一邊
    for (let j = 0; j < n; j++) {
      const v = levels[j];                                         // j = 0 是最低音（最靠中間）
      for (const k of [n - 1 - j, n + j]) {                        // 左側與右側對稱位置
        emitAcc[k] += dt * Math.pow(v, 1.6) * 16;                  // 越強噴越多
        while (emitAcc[k] >= 1 && motes.length < 900) {
          emitAcc[k] -= 1;
          motes.push({
            x: left + k * gap + gap / 2 + (Math.random() - 0.5) * gap,
            y: base - Math.random() * 6,
            vy: -(28 + Math.random() * 50) * (0.6 + v * 1.6),
            sway: Math.random() * 6.28, swayAmp: 6 + Math.random() * 10,
            size: 3 + Math.random() * 5 * (0.5 + v),
            age: 0, life: 1.1 + Math.random() * 1.1, maxRise: Math.min(mh * (0.45 + v * 0.8), room / 1.3)
          });
        }
        if (emitAcc[k] > 1) emitAcc[k] = 1;
      }
    }
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.age += dt;
      m.y += m.vy * dt;
      m.vy *= Math.exp(-dt * 0.8);                                  // 越飛越慢
      const risen = base - m.y;
      if (m.age >= m.life || risen > m.maxRise * 1.3) { motes.splice(i, 1); continue; }
      const t = m.age / m.life;
      const a = Math.min(1, t / 0.12) * (1 - t) * (1 - Math.min(1, risen / (m.maxRise * 1.3)) * 0.6);
      const x = m.x + Math.sin(m.sway + m.age * 2.2) * m.swayAmp * t;
      ctx.globalAlpha = a;
      ctx.drawImage(MOTE, x - m.size, m.y - m.size, m.size * 2, m.size * 2);
    }
    ctx.globalAlpha = 1;
    // 底部一道淡淡的發光基線，跟著音量明暗
    const g = ctx.createLinearGradient(left, 0, left + span, 0);
    g.addColorStop(0, 'rgba(255,220,140,0)'); g.addColorStop(0.5, `rgba(255,225,150,${0.25 + A.level * 0.5})`); g.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = g; ctx.fillRect(left, base, span, 1.2);
  }

  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
    last = now;
    ctx.clearRect(0, 0, w, h);
    if (active && analyser) {
      analyser.getByteFrequencyData(freq);
      const bass = band(30, 160), mid = band(160, 2000), treble = band(2000, 9000);
      A.bass = follow(A.bass, bass, 0.6, 0.15);
      A.mid = follow(A.mid, mid, 0.5, 0.12);
      A.treble = follow(A.treble, treble, 0.5, 0.12);
      A.level = follow(A.level, (bass * 0.5 + mid * 0.35 + treble * 0.15), 0.4, 0.08);
      // 節拍：低音突然高於近期平均
      bassAvg = bassAvg * 0.96 + bass * 0.04;
      if (bass > bassAvg * 1.25 + 0.06 && bass > 0.3 && now - lastBeat > 280) {
        lastBeat = now; A.beatId++; A.beatStrength = Math.min(1, (bass - bassAvg) * 3);
      }
      const f = fx();
      ctx.globalCompositeOperation = 'lighter';
      updateLevels();
      if (f.eqBars !== false) { if (f.eqStyle === 'rise') drawRise(dt); else drawWave(); }
      ctx.globalCompositeOperation = 'source-over';
      // 十字架跟著低音亮一下
      const R = window.worshipAudioReact();
      crossWrap.style.filter = R && !reduce ? `brightness(${(1 + R.bass * 0.35 + (now - lastBeat < 160 ? 0.15 : 0)).toFixed(3)})` : '';
    }
    requestAnimationFrame(frame);
  }

  // 方便測試：在主控台輸入 worshipAudioTest() 以合成音樂模擬（不需分享音訊）
  window.worshipAudioTest = () => {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const out = audioCtx.createGain(); out.gain.value = 0.6;
    const kick = audioCtx.createOscillator(); kick.frequency.value = 60;
    const kg = audioCtx.createGain(); kg.gain.value = 0; kick.connect(kg).connect(out);
    const pad = audioCtx.createOscillator(); pad.type = 'sawtooth'; pad.frequency.value = 220;
    const pg = audioCtx.createGain(); pg.gain.value = 0.25; pad.connect(pg).connect(out);
    const hi = audioCtx.createOscillator(); hi.type = 'square'; hi.frequency.value = 3200;
    const hg = audioCtx.createGain(); hg.gain.value = 0.05; hi.connect(hg).connect(out);
    const t0 = audioCtx.currentTime;
    for (let i = 0; i < 200; i++) { kg.gain.setValueAtTime(1, t0 + i * 0.5); kg.gain.exponentialRampToValueAtTime(0.01, t0 + i * 0.5 + 0.3); }
    [kick, pad, hi].forEach(o => o.start());
    out.stop = () => [kick, pad, hi].forEach(o => o.stop());
    connect(null, out);
  };

  window.addEventListener('resize', resize);
  resize();
  render();
  requestAnimationFrame(frame);
})();
</script>
