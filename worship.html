  let shuffle = false;
  try { shuffle = !!JSON.parse(localStorage.getItem(KEY) || '{}').shuffle; } catch (e) {}
  // 隨機模式：洗牌後依序播完一輪再重洗，同一輪不重複、換輪時也不會連續同一則
  let order = [], pos = -1, current = -1;
  function buildOrder() {
    const idx = VERSES.map((_, n) => n);
    if (shuffle) {
      for (let n = idx.length - 1; n > 0; n--) { const r = Math.floor(Math.random() * (n + 1)); [idx[n], idx[r]] = [idx[r], idx[n]]; }
      if (idx[0] === current && idx.length > 1) [idx[0], idx[1]] = [idx[1], idx[0]];
    }
    return idx;
  }
  function nextIndex() {
    if (!order.length || pos >= order.length - 1) {
      if (!shuffle && order.length) { pos = 0; return order[0]; }   // 依序：播完回到第 1 則
      order = buildOrder(); pos = 0; return order[0];
    }
    return order[++pos];
  }

  // 把經文依標點切成語句，讓換行只發生在標點之後，不會在詞句中間斷開
  function renderPhrases(text) {
    const parts = text.match(/[^，；。！？：、]+[，；。！？：、]*」?|.+$/g) || [text];
    textEl.textContent = '';
    for (const part of parts) {
      const span = document.createElement('span');
      span.className = 'phrase';
      span.textContent = part;
      textEl.appendChild(span);
    }
  }

  // 依經文長短決定停留時間：約 8～20 秒
  const holdTime = t => Math.min(20000, 8000 + t.length * 120);

  let holdTimer = 0, swapTimer = 0;
  function display(idx) {
    current = idx;
    const v = VERSES[idx];
    renderPhrases(v.text);
    refEl.textContent = v.ref;
    box.classList.remove('quick');
    box.classList.add('show');
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => advance(false), FADE + holdTime(v.text));
  }
  // 換到下一則；quick = 使用者手動按的，用較快的淡出
  function advance(quick) {
    clearTimeout(holdTimer); clearTimeout(swapTimer);
    const visible = box.classList.contains('show');
    box.classList.toggle('quick', quick);
    box.classList.remove('show');
    swapTimer = setTimeout(() => display(nextIndex()), visible ? (quick ? 650 : FADE + 600) : 0);
  }

  const toast = msg => window.worshipToast && window.worshipToast(msg);
  const nextBtn = document.getElementById('nextVerseBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  function renderShuffle() {
    shuffleBtn.setAttribute('aria-pressed', String(shuffle));
    shuffleBtn.setAttribute('aria-label', '隨機播放經文：' + (shuffle ? '開' : '關'));
    shuffleBtn.querySelector('.dock-label').textContent = '隨機播放經文：' + (shuffle ? '開' : '關');
  }
  function setShuffle(on) {
    shuffle = on;
    try { localStorage.setItem(KEY, JSON.stringify({ shuffle })); } catch (e) {}
    // 依新模式重排：依序模式從目前這則接著往下；隨機模式重新洗牌
    order = buildOrder();
    pos = shuffle ? -1 : Math.max(0, order.indexOf(current));
    if (shuffle) { order = buildOrder(); pos = -1; }
    renderShuffle();
    toast(shuffle ? '🔀 隨機播放經文' : '依序播放經文');
  }
  // 手動換下一則時，銀河星空同時往前曲速推進
  // 手動換下一則時：銀河星空曲速推進＋天降光束送出光波＋光點粒子漣漪
  const nextVerse = () => {
    advance(true);
    window.worshipGalaxyWarp && window.worshipGalaxyWarp();
    window.worshipLightRaysPulse && window.worshipLightRaysPulse();
    window.worshipParticlesBurst && window.worshipParticlesBurst();
  };
  nextBtn.addEventListener('click', nextVerse);
  shuffleBtn.addEventListener('click', () => setShuffle(!shuffle));
  // 鍵盤：N 下一則、S 切換隨機
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('.mac-menu')) return;
    if (e.key === 'n' || e.key === 'N') nextVerse();
    if (e.key === 's' || e.key === 'S') setShuffle(!shuffle);
  });
  renderShuffle();
  setTimeout(() => display(nextIndex()), 1200);
})();
</script>

<script>
// 防止螢幕休眠（像播放影片一樣讓螢幕保持亮著）
(() => {
  const btn = document.getElementById('wakeBtn');
  const toastEl = document.getElementById('toast');
  const video = document.getElementById('nosleepVideo');
  let enabled = true;        // 預設開啟
  let lock = null;
  let toastTimer;

  window.worshipToast = msg => toast(msg);
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  async function acquire() {
    if (!enabled || document.visibilityState !== 'visible') return false;
    // 方法一：瀏覽器原生 Screen Wake Lock
    if ('wakeLock' in navigator) {
      try {
        if (!lock) {
          lock = await navigator.wakeLock.request('screen');
          lock.addEventListener('release', () => { lock = null; });
        }
        return true;
      } catch (e) { /* 被拒絕時改用備援 */ }
    }
    // 方法二：播放隱藏的無聲循環影片
    try { await video.play(); return true; } catch (e) { return false; }
  }

  async function release() {
    if (lock) { try { await lock.release(); } catch (e) {} lock = null; }
    video.pause();
  }

  function render() {
    btn.classList.toggle('off', !enabled);
    btn.setAttribute('aria-pressed', String(enabled));
    btn.setAttribute('aria-label', '防止螢幕休眠：' + (enabled ? '開啟' : '關閉'));
    btn.querySelector('.dock-label').textContent = '防止螢幕休眠：' + (enabled ? '開' : '關');
  }

  btn.addEventListener('click', async e => {
    e.stopPropagation();
    enabled = !enabled;
    render();
    if (enabled) {
      const ok = await acquire();
      toast(ok ? '☀ 螢幕將保持開啟' : '此瀏覽器不支援防止休眠');
    } else {
      await release();
      toast('螢幕休眠已恢復正常');
    }
  });

  // 開啟頁面時先嘗試；部分瀏覽器（如 iPhone）需要先點一下畫面才能啟用
  acquire();
  const firstTouch = async () => {
    if (await acquire()) {
      ['click', 'touchend', 'keydown'].forEach(ev => document.removeEventListener(ev, firstTouch));
    }
  };
  ['click', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, firstTouch));

  // 切到別的分頁或 App 再回來時，系統會自動解除，這裡重新取得
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') acquire();
  });
  document.addEventListener('fullscreenchange', () => acquire());

  render();
})();
</script>

<script>
// 全螢幕功能：按鈕、F 鍵、雙擊畫面
(() => {
  const root = document.documentElement;
  const btn = document.getElementById('fsBtn');
  const supported = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const current = () => document.fullscreenElement || document.webkitFullscreenElement;

  if (!supported) btn.hidden = true;   // 例如 iPhone Safari 不支援，隱藏按鈕（但仍保留自動隱藏功能列）

  async function toggle() {
    if (!supported) return;
    try {
      if (current()) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      }
    } catch (e) { /* 瀏覽器拒絕時保持原狀 */ }
  }

  function sync() {
    const on = !!current();
    document.body.classList.toggle('is-fullscreen', on);
    btn.setAttribute('aria-label', on ? '離開全螢幕' : '進入全螢幕');
    btn.querySelector('.dock-label').textContent = on ? '離開全螢幕' : '全螢幕';
  }

  btn.addEventListener('click', toggle);
  document.addEventListener('dblclick', e => { if (!e.target.closest('.dock, .mac-menu')) toggle(); });
  document.addEventListener('keydown', e => {
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) toggle();
  });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);

  // 3 秒沒動作就隱藏按鈕與游標，讓畫面更沉浸
  let timer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (document.body.classList.contains('panel-open')) return wake();
      document.body.classList.add('idle');
    }, 3000);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true }));
  wake();
})();
</script>

<script>
// 流星：發光的流星頭＋彎曲漸細的光尾＋沿途灑落的金色餘燼，偶爾會出現一小陣流星雨
(() => {
  const canvas = document.getElementById('sparkles');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 預先畫好柔光圓點（白、淡金、金），餘燼與流星頭都用它，效能較好
  const makeSprite = (r, g, b) => {
    const s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    const x = c.getContext('2d');
    const grad = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, `rgba(255,255,255,1)`);
    grad.addColorStop(0.18, `rgba(${r},${g},${b},0.9)`);
    grad.addColorStop(0.45, `rgba(${r},${g},${b},0.25)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = grad;
    x.fillRect(0, 0, s, s);
    return c;
  };
  const SPRITES = [makeSprite(255, 255, 255), makeSprite(255, 236, 170), makeSprite(255, 205, 90)];

  // 流星頭的星星：與「銀河星空」相同的畫法（1/d 光暈＋十字星芒＋較淡的斜向星芒）
  const STAR = (() => {
    const N = 192, c = document.createElement('canvas');
    c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N);
    const glow = 0.022, flareGain = 0.55;                       // 對應銀河的 uStarGlow / uFlareGain
    const ss = t => (t = Math.min(1, Math.max(0, t)), t * t * (3 - 2 * t));
    const smooth = (a, b, v) => ss((v - a) / (b - a));
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      let u = (i + 0.5) / N - 0.5, v = (j + 0.5) / N - 0.5;    // 一個星格的座標 -0.5～0.5
      const d = Math.hypot(u, v) || 1e-4;
      let m = glow / d;
      m += smooth(0, 1, 1 - Math.abs(u * v * 1000)) * flareGain;
      const u2 = (u - v) * 0.7071, v2 = (u + v) * 0.7071;       // 旋轉 45 度
      m += smooth(0, 1, 1 - Math.abs(u2 * v2 * 1000)) * 0.3 * flareGain;
      m *= smooth(1, 0.2, d) * smooth(0.5, 0.32, d);             // 邊緣淡出，避免看到方形邊界
      const a = Math.min(1, m);
      const k = (j * N + i) * 4;
      img.data[k] = 255; img.data[k + 1] = 255; img.data[k + 2] = 255;
      img.data[k + 3] = Math.round(smooth(0, 0.3, m) * a * 255);
    }
    x.putImageData(img, 0, 0);
    return c;
  })();

  let meteors = [], embers = [], queue = [];
  let nextMeteor = performance.now() + 2500 + Math.random() * 3000;

  // 流星軌跡：二次貝茲曲線，從一側畫面外出發、從另一側畫面外離開，中途畫出弧線
  const bez = (m, t) => {
    const u = 1 - t;
    return {
      x: u * u * m.p0.x + 2 * u * t * m.p1.x + t * t * m.p2.x,
      y: u * u * m.p0.y + 2 * u * t * m.p1.y + t * t * m.p2.y
    };
  };
  const bezTangent = (m, t) => {
    const u = 1 - t;
    return {
      x: 2 * u * (m.p1.x - m.p0.x) + 2 * t * (m.p2.x - m.p1.x),
      y: 2 * u * (m.p1.y - m.p0.y) + 2 * t * (m.p2.y - m.p1.y)
    };
  };

  function spawnMeteor(base) {
    const fromLeft = base ? base.fromLeft : Math.random() < 0.5;
    const scale = 0.75 + Math.random() * 0.6;                       // 粗細與亮度
    // 依螢幕寬度縮放：手機上光尾短一點，才不會一條光尾就橫跨整個畫面
    const screenK = Math.min(1, Math.max(0.5, w / 1100));
    const len = (180 + Math.random() * 160) * scale * screenK;
    const margin = 40;
    const sx = fromLeft ? -margin : w + margin;                     // 從左側或右側畫面外出發
    const ex = fromLeft ? w + margin : -margin;                     // 從另一側畫面外離開
    // 起點高度：畫面上方 4%～35%；終點比起點低 4%～25%（不超過畫面 60%，盡量不壓到經文）
    const y0 = base ? Math.min(h * 0.5, Math.max(h * 0.03, base.y0 + (Math.random() - 0.5) * h * 0.12))
                    : h * (0.04 + Math.random() * 0.31);
    const drop = base ? base.drop * (0.85 + Math.random() * 0.3) : h * (0.04 + Math.random() * 0.21);
    const y1 = Math.min(h * 0.6, y0 + drop);
    // 弧度：多數往上拱起（像拋出去再落下），少數往下凹；控制點限制在畫面內，弧線不會從上下緣跑出去
    const bulge = base ? base.bulge : (Math.random() < 0.7 ? -1 : 0.6) * h * (0.08 + Math.random() * 0.14);
    const cx = w * (0.35 + Math.random() * 0.3);
    const cy = Math.min(h * 0.68, Math.max(h * 0.02, (y0 + y1) / 2 + bulge));
    const m = {
      p0: { x: sx, y: y0 }, p1: { x: cx, y: cy }, p2: { x: ex, y: y1 },
      t: 0,
      speed: 0,                                                     // 下方依「橫越時間」換算
      len,
      width: 2.2 * scale,
      glow: scale,
      age: 0,
      trail: [],
      sparkAcc: 0
    };
    // 估算曲線長度，讓流星以固定速度前進
    let L = 0, prev = bez(m, 0);
    for (let i = 1; i <= 24; i++) { const q = bez(m, i / 24); L += Math.hypot(q.x - prev.x, q.y - prev.y); prev = q; }
    m.length = L;
    // 以「橫越畫面所需時間」決定速度，手機與電腦看起來一樣從容
    // 電腦約 1.4～2.2 秒；窄螢幕（手機）約 2.2～3.2 秒，因為小螢幕上同樣的移動看起來更快
    const narrow = w < 700;
    const duration = (narrow ? 2.2 : 1.4) + Math.random() * (narrow ? 1.0 : 0.8);
    m.speed = L / duration;
    Object.assign(m, bez(m, 0));
    const tg = bezTangent(m, 0), tl = Math.hypot(tg.x, tg.y) || 1;
    m.vx = tg.x / tl * m.speed; m.vy = tg.y / tl * m.speed;
    meteors.push(m);
    return { fromLeft, y0, drop, bulge };
  }

  // 偶爾（約 25%）來一小陣 2～4 顆的流星雨
  function launch(now) {
    const first = spawnMeteor();
    if (Math.random() < 0.25) {
      const extra = 1 + Math.floor(Math.random() * 3);
      for (let i = 1; i <= extra; i++) queue.push({ at: now + i * (180 + Math.random() * 380), base: first });
    }
  }

  function emitEmber(x, y, vx, vy, big) {
    embers.push({
      x, y,
      vx: vx + (Math.random() - 0.5) * 40,
      vy: vy + (Math.random() - 0.5) * 40,
      size: (big ? 2.4 : 1.2) + Math.random() * (big ? 2.2 : 1.6),
      age: 0,
      life: 0.6 + Math.random() * 0.9,
      sprite: SPRITES[(Math.random() * SPRITES.length) | 0],
      phase: Math.random() * 6.28
    });
  }

  const envelope = age => Math.min(1, age / 0.12);   // 快速點亮，之後一路亮著直到飛出畫面

  function drawTail(m, alpha) {
    const pts = m.trail;
    if (pts.length < 2) return;
    // 由頭往尾累積距離，取出光尾長度內的點
    const path = [pts[pts.length - 1]];
    let dist = 0;
    for (let i = pts.length - 2; i >= 0 && dist < m.len; i--) {
      const p = pts[i], q = path[path.length - 1];
      dist += Math.hypot(q.x - p.x, q.y - p.y);
      path.push(p);
    }
    if (path.length < 2) return;
    const head = path[0], tip = path[path.length - 1];
    // 三層：寬柔金光 → 暖白 → 白色核心，形成有厚度的光尾
    const layers = [
      [m.width * 7, [255, 196, 80], 0.16],
      [m.width * 2.8, [255, 232, 170], 0.42],
      [m.width * 0.9, [255, 255, 255], 0.95]
    ];
    for (const [wid, [r, g, b], a] of layers) {
      const left = [], right = [];
      for (let i = 0; i < path.length; i++) {
        const p = path[i], q = path[Math.min(i + 1, path.length - 1)], o = path[Math.max(i - 1, 0)];
        let nx = -(q.y - o.y), ny = q.x - o.x;
        const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        const taper = Math.pow(1 - i / (path.length - 1), 1.6);   // 越往尾端越細
        const hw = wid * taper * 0.5;
        left.push([p.x + nx * hw, p.y + ny * hw]);
        right.push([p.x - nx * hw, p.y - ny * hw]);
      }
      const grad = ctx.createLinearGradient(head.x, head.y, tip.x, tip.y);
      grad.addColorStop(0, `rgba(${r},${g},${b},${a * alpha})`);
      grad.addColorStop(0.35, `rgba(${r},${g},${b},${a * alpha * 0.45})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(left[0][0], left[0][1]);
      for (let i = 1; i < left.length; i++) ctx.lineTo(left[i][0], left[i][1]);
      for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawHead(m, alpha, time) {
    // 外圈淡淡的金色光暈，讓星星和金色光尾自然銜接
    const r = 16 * m.glow;
    ctx.globalAlpha = alpha * 0.55;
    ctx.drawImage(SPRITES[2], m.x - r * 1.4, m.y - r * 1.4, r * 2.8, r * 2.8);
    // 星星本體（與銀河星空同款），閃爍幅度同銀河的 twinkle 0.3
    const tri = t => { const f = t - Math.floor(t); return 2 * (1 - (x => x * x * (3 - 2 * x))(Math.abs(2 * f - 1))) - 1; };
    const twinkle = 1 + 0.3 * (tri(time * 1.6 + m.len * 0.01) * 0.5);
    const size = 80 * m.glow * twinkle;
    ctx.globalAlpha = Math.min(1, alpha * twinkle);
    ctx.drawImage(STAR, m.x - size / 2, m.y - size / 2, size, size);
    ctx.globalAlpha = 1;
  }

  let last = 0, time = 0;
  function draw(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
    last = now; time += dt;
    ctx.clearRect(0, 0, w, h);
    if (!window.worshipFx.meteors) {
      meteors = []; embers = []; queue = []; nextMeteor = now + 3000;
      requestAnimationFrame(draw); return;
    }
    if (!reduceMotion && now > nextMeteor) { launch(now); nextMeteor = now + 6000 + Math.random() * 10000; }
    queue = queue.filter(q => { if (now >= q.at) { spawnMeteor(q.base); return false; } return true; });

    ctx.globalCompositeOperation = 'lighter';   // 光線疊加會自然變亮

    // 流星
    meteors = meteors.filter(m => {
      m.age += dt;
      // 沿著弧線前進；超過終點後沿切線方向繼續飛，直到整條光尾離開畫面
      m.t += m.speed * dt / m.length;
      if (m.t <= 1) {
        Object.assign(m, bez(m, m.t));
        const tg = bezTangent(m, m.t), tl = Math.hypot(tg.x, tg.y) || 1;
        m.vx = tg.x / tl * m.speed; m.vy = tg.y / tl * m.speed;
      } else {
        m.x += m.vx * dt; m.y += m.vy * dt;
      }
      // 流星頭與整條光尾都從兩側離開畫面後才移除
      const out = m.len + 60;
      if (m.x < -out || m.x > w + out || m.age > 10) return false;
      const onScreen = m.x > -20 && m.x < w + 20 && m.y > -20 && m.y < h + 20;
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > 120) m.trail.shift();
      // 沿途灑落餘燼
      m.sparkAcc += dt * 70 * m.glow;
      while (m.sparkAcc >= 1) { m.sparkAcc -= 1; if (onScreen) emitEmber(m.x, m.y, m.vx * 0.06, m.vy * 0.06 + 10, false); }
      const alpha = envelope(m.age);
      drawTail(m, alpha);
      drawHead(m, alpha, time);
      return true;
    });

    // 餘燼：慢慢減速、微微下墜、閃爍著熄滅
    embers = embers.filter(e => {
      e.age += dt;
      if (e.age >= e.life) return false;
      const drag = Math.exp(-dt * 2.2);
      e.vx *= drag; e.vy = e.vy * drag + 28 * dt;
      e.x += e.vx * dt; e.y += e.vy * dt;
      const k = 1 - e.age / e.life;
      const tw = 0.65 + 0.35 * Math.sin(time * 22 + e.phase);
      const s = e.size * (0.6 + 0.4 * k) * 4;
      ctx.globalAlpha = k * k * tw;
      ctx.drawImage(e.sprite, e.x - s / 2, e.y - s / 2, s, s);
      return true;
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }

  // 方便測試：在主控台輸入 worshipMeteorTest() 立刻來一顆
  window.worshipMeteorTest = () => launch(performance.now());
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
<script>
// 底部 Dock：滑鼠靠近時圖示以彈簧物理放大，點擊時像 macOS 一樣彈跳
(() => {
  const root = document.getElementById('dock');
  const S = {
    base: 50, peak: 70, thickness: 68, gap: 10, distance: 200,
    mass: 0.1, stiffness: 150, damping: 12, hop: 0.4, hopTime: 0.38
  };
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const children = [...root.children];
  const motion = new Map();
  const pointer = { x: 0, inside: false };
  let fit = 1, base = S.base, peak = S.peak, distance = S.distance, gap = S.gap;
  let focused = null, raf = 0, last = 0;

  const visible = () => children.filter(el => !el.hidden);

  // 畫面太窄時整體等比縮小
  function measure() {
    const list = visible();
    const len = list.reduce((sum, el) => sum + (el.classList.contains('dock-separator') ? 1 : S.base), 0)
      + S.gap * Math.max(0, list.length - 1) + S.thickness - S.base + S.peak - S.base;
    fit = Math.min(1, Math.max(0.4, (document.documentElement.clientWidth - 24) / len));
    base = S.base * fit; peak = S.peak * fit; distance = S.distance * fit; gap = S.gap * fit;
    const thick = S.thickness * fit;
    root.style.setProperty('--dock-base', base + 'px');
    root.style.setProperty('--dock-thickness', thick + 'px');
    root.style.setProperty('--dock-gap', gap + 'px');
    root.style.setProperty('--dock-pad', (thick - base) / 2 + 'px');
    root.style.setProperty('--dock-reach', (peak - base) + 'px');
    motion.forEach(st => { st.size = base; st.drawn = ''; });
    wake();
  }

  const entry = el => {
    let st = motion.get(el);
    if (!st) { st = { size: base, velocity: 0, lift: 0, rise: 0, launch: 0, gravity: 0, hopping: false, drawn: '' }; motion.set(el, st); }
    return st;
  };

  function tick(now) {
    raf = 0;
    const dt = Math.min(1 / 30, Math.max(0.001, (now - last) / 1000));
    last = now;
    const list = visible();
    const rect = root.getBoundingClientRect();
    const center = rect.left + rect.width / 2;
    const spans = list.map(el => el.classList.contains('dock-separator') ? 1 : base);
    let cursor = -(spans.reduce((a, b) => a + b, 0) + gap * Math.max(0, spans.length - 1)) / 2;
    const rest = spans.map(span => { const mid = cursor + span / 2; cursor += span + gap; return mid; });
    let focus = null;
    if (pointer.inside) focus = pointer.x - center;
    else if (focused && list.includes(focused)) focus = rest[list.indexOf(focused)];

    const steps = Math.max(1, Math.ceil(dt * 240));
    const h = dt / steps;
    const k = S.stiffness / S.mass;
    const c = S.damping / S.mass;
    let moving = false;

    list.forEach((el, i) => {
      if (el.classList.contains('dock-separator')) return;
      const st = entry(el);
      const reach = focus === null ? 1 : Math.abs(focus - rest[i]) / distance;
      const target = base + (peak - base) * (reach < 1 ? Math.cos((reach * Math.PI) / 2) ** 2 : 0);
      if (reduce) { st.size = target; st.velocity = 0; }
      else {
        for (let j = 0; j < steps; j++) {
          // 半隱式彈簧積分（與原元件相同）
          st.velocity = (st.velocity + h * k * (target - st.size)) / (1 + h * c + h * h * k);
          st.size += st.velocity * h;
          if (!st.hopping) continue;
          st.rise -= st.gravity * h;
          st.lift += st.rise * h;
          if (st.lift > 0) continue;
          st.lift = 0;
          st.rise *= -0.36;                       // 落地反彈
          if (st.rise < st.launch * 0.2) { st.rise = 0; st.hopping = false; el.removeAttribute('data-hop'); }
        }
      }
      if (Math.abs(st.velocity) < 0.01 && Math.abs(target - st.size) < 0.01) { st.size = target; st.velocity = 0; }
      else moving = true;
      if (st.hopping) moving = true;
      const size = Math.max(1, st.size);
      const drawn = size.toFixed(2) + ' ' + st.lift.toFixed(2);
      if (drawn === st.drawn) return;
      st.drawn = drawn;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.firstElementChild.style.transform = `translate(0, ${-st.lift}px) scale(${size / base})`;
    });
    if (moving) raf = requestAnimationFrame(tick);
  }

  function wake() {
    if (raf) return;
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function hop(el) {
    if (reduce) return;
    const st = entry(el);
    if (st.hopping) return;
    const height = st.size * S.hop;
    st.gravity = (8 * height) / (S.hopTime * S.hopTime);
    st.launch = (st.gravity * S.hopTime) / 2;
    st.rise = st.launch;
    st.hopping = true;
    el.setAttribute('data-hop', '');
    wake();
  }

  const onMove = e => { pointer.x = e.clientX; pointer.inside = true; wake(); };
  const onLeave = () => { pointer.inside = false; wake(); };
  root.addEventListener('pointermove', onMove);
  root.addEventListener('pointerdown', onMove);
  root.addEventListener('pointerleave', onLeave);
  root.addEventListener('pointercancel', onLeave);
  // 觸控放開後恢復原大小
  root.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') onLeave(); });

  children.forEach(el => {
    if (!el.classList.contains('dock-item')) return;
    el.addEventListener('click', () => hop(el));
    el.addEventListener('focus', () => { if (el.matches(':focus-visible')) { focused = el; wake(); } });
    el.addEventListener('blur', () => { focused = null; wake(); });
  });

  // 鍵盤：左右方向鍵在圖示間移動
  root.addEventListener('keydown', e => {
    const items = visible().filter(el => el.classList.contains('dock-item'));
    const at = items.indexOf(document.activeElement);
    if (at < 0) return;
    let next = null;
    if (e.key === 'ArrowLeft') next = items[(at - 1 + items.length) % items.length];
    else if (e.key === 'ArrowRight') next = items[(at + 1) % items.length];
    else if (e.key === 'Home') next = items[0];
    else if (e.key === 'End') next = items[items.length - 1];
    if (next) { e.preventDefault(); next.focus(); }
  });

  window.addEventListener('resize', measure);
  // 全螢幕按鈕在不支援的裝置會被隱藏，等其他腳本跑完再量一次
  setTimeout(measure, 0);
  measure();
})();
</script>

<script>
// 銀河星空（移植自 React Bits Galaxy，改為純 JavaScript 版），取代原本的白色飄落星點
(() => {
  const container = document.getElementById('galaxy');
  const canvas = container.querySelector('canvas');
  const fxOn = () => !window.worshipFx || window.worshipFx.galaxy !== false;

  // ---- 參數（對應原元件的 props） ----
  const S = {
    focal: [0.5, 0.5],
    rotation: [1, 0],
    starSpeed: 0.5,
    density: 1,
    hueShift: 140,
    speed: 1,
    mouseInteraction: false,  // 不受滑鼠影響
    glowIntensity: 0.3,
    saturation: 0,            // 0 = 白色星星
    mouseRepulsion: false,
    repulsionStrength: 2,
    twinkleIntensity: 0.3,
    rotationSpeed: 0.1,
    autoCenterRepulsion: 0,
    starSize: 1,
    flareIntensity: 1,
    layers: 4,
    reverse: false,
    clickWarp: false,         // 點擊畫面不觸發曲速
    intro: true,
    opacity: 1
  };
  const MAX_LAYERS = 8, MAX_COLORS = 4, INTRO_SECONDS = 2.2;

  const VERTEX = `#version 300 es
in vec2 aPosition;
void main() { gl_Position = vec4(aPosition, 0.0, 1.0); }`;

  const FRAGMENT = `#version 300 es
precision highp float;
precision highp int;
uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uGloss;
uniform float uDepth;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uStarGlow;
uniform float uFlareGain;
uniform float uSquash;
uniform float uSaturation;
uniform float uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationAngle;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform int uLayers;
uniform vec3 uColors[${MAX_COLORS}];
uniform int uColorCount;
uniform float uWarp;
uniform float uReveal;
uniform float uOpacity;
out vec4 outColor;
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0
float Hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float tri(float x) { return abs(fract(x) * 2.0 - 1.0); }
float tris(float x) { float t = fract(x); return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0)); }
float trisn(float x) { float t = fract(x); return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0; }
vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}
float Star(vec2 uv, float flare, vec2 radial, float invReach) {
#ifdef WARP
  float along = dot(uv, radial);
  float d = sqrt(max(dot(uv, uv) - uSquash * along * along, 0.0));
#else
  float d = length(uv);
#endif
  float m = uStarGlow / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uFlareGain;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uFlareGain;
  m *= smoothstep(1.0, 0.2, d * invReach);
#ifdef WARP
  m *= mix(1.0, smoothstep(1.0, 0.55, length(uv) * invReach), min(uWarp * 4.0, 1.0));
#endif
  return m;
}
vec3 StarLayer(vec2 uv, vec2 radial, vec2 repelAt, float pushCells, float spread) {
  vec3 col = vec3(0.0);
  vec2 gv = fract(uv) - 0.5;
  vec2 id = floor(uv);
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + offset;
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uGloss / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;
#ifdef PALETTE
      float pick = Hash21(si + 7.0) * float(uColorCount);
      vec3 base = uColors[int(min(floor(pick), float(uColorCount - 1)))];
#else
      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));
#endif
      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;
      vec2 shift = vec2(0.0);
      float invReach = 1.0;
#ifdef REPEL
      vec2 away = si + 0.5 + pad - repelAt;
      float dist = length(away);
      float q = dist * spread;
      float cells = pushCells * exp(-q * q);
      float moved = cells * inversesqrt(1.0 + cells * cells * 2.78);
      shift = away * (moved / max(dist, 0.0001));
      invReach = 1.0 / (1.0 - moved);
#endif
      float star = Star(gv - offset - pad - shift, flareSize, radial, invReach);
      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);

}
void main() {
  vec2 focalPx = uFocal * uResolution;
  vec2 uv = (gl_FragCoord.xy - focalPx) / uResolution.y;
  vec2 mouseNorm = uMouse - vec2(0.5);
  vec2 repelAt = vec2(0.0);
  float strength = 0.0;
  float push = 0.0;
  if (uAutoCenterRepulsion > 0.0) {
    strength = uAutoCenterRepulsion;
    push = strength * 0.05;
  } else if (uMouseRepulsion > 0.5) {
    repelAt = (uMouse * uResolution - focalPx) / uResolution.y;
    strength = max(uRepulsionStrength, 0.0);
    push = strength * 0.05 * uMouseActiveFactor;
  } else {
    uv += mouseNorm * 0.1 * uMouseActiveFactor;
  }

  vec2 radial = length(uv) > 0.0001 ? normalize(uv) : vec2(1.0, 0.0);
  float angle = uRotationAngle;
  mat2 spin = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
  mat2 fixedRot = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x);
  uv = fixedRot * (spin * uv);
  radial = fixedRot * (spin * radial);
  repelAt = fixedRot * (spin * repelAt);
  vec3 col = vec3(0.0);
  float layers = float(uLayers);
  for (int k = 0; k < ${MAX_LAYERS}; k++) {
    if (k >= uLayers) break;
    float i = float(k) / layers;
    float depth = fract(i + uDepth);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    vec2 offset = vec2(i * 453.32);
    col += StarLayer(uv * scale + offset, radial, repelAt * scale + offset, push * scale, 1.0 / (scale * radius)) * fade;
  }
  col *= uReveal;
  // 透明背景模式（transparent = true）
  float alpha = min(smoothstep(0.0, 0.3, length(col)), 1.0) * uOpacity;
  outColor = vec4(col * alpha, alpha);
}`;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
  if (!gl) { container.hidden = true; return; }

  // 依「是否推開星星／是否曲速」編譯 4 種著色器變體
  const programs = new Map();
  function build(repel, warp) {
    const key = (repel ? 2 : 0) + (warp ? 1 : 0);
    if (programs.has(key)) return programs.get(key);
    const defines = (repel ? '#define REPEL\n' : '') + (warp ? '#define WARP\n' : '');
    const program = gl.createProgram();
    const vs = gl.createShader(gl.VERTEX_SHADER), fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(vs, VERTEX);
    gl.shaderSource(fs, FRAGMENT.replace('\n', '\n' + defines));
    gl.compileShader(vs); gl.compileShader(fs);
    gl.attachShader(program, vs); gl.attachShader(program, fs);
    gl.bindAttribLocation(program, 0, 'aPosition');
    gl.linkProgram(program);
    gl.deleteShader(vs); gl.deleteShader(fs);
    let result = null;
    if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const uniforms = {};
      for (let n = 0, c = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); n < c; n++) {
        const info = gl.getActiveUniform(program, n);
        uniforms[info.name.replace('[0]', '')] = gl.getUniformLocation(program, info.name);
      }
      result = { program, uniforms };
    } else {
      console.error(gl.getProgramInfoLog(program));
    }
    programs.set(key, result);
    return result;
  }
  if (!build(false, false)) { container.hidden = true; return; }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = new Float32Array(MAX_COLORS * 3);
  const pointer = { x: 0.5, y: 0.5, inside: false };
  const state = { time: 0, gloss: 0, depth: 0, angle: 0, mx: 0.5, my: 0.5, active: 0, boost: 0, reveal: S.intro && !reduce ? 0 : 1 };
  let raf = 0, last = 0;

  function render() {
    const repel = S.autoCenterRepulsion > 0 || (S.mouseRepulsion && S.repulsionStrength > 0 && state.active > 0);
    const warp = state.boost > 0;
    const prog = build(repel, warp) || build(false, false);
    const u = prog.uniforms;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog.program);
    gl.bindVertexArray(vao);
    gl.uniform1f(u.uTime, state.time);
    gl.uniform2f(u.uResolution, canvas.width, canvas.height);
    gl.uniform2f(u.uFocal, S.focal[0], S.focal[1]);
    gl.uniform2f(u.uRotation, S.rotation[0], S.rotation[1]);
    gl.uniform1f(u.uGloss, state.gloss);
    gl.uniform1f(u.uDepth, state.depth);
    gl.uniform1f(u.uDensity, S.density);
    gl.uniform1f(u.uHueShift, S.hueShift);
    gl.uniform1f(u.uSpeed, S.speed);
    gl.uniform2f(u.uMouse, state.mx, state.my);
    const stretch = 1 + state.boost * 5;
    gl.uniform1f(u.uStarGlow, (0.05 * S.glowIntensity * S.starSize) / Math.pow(stretch, 0.6));
    gl.uniform1f(u.uFlareGain, S.glowIntensity * S.flareIntensity);
    gl.uniform1f(u.uSquash, 1 - 1 / (stretch * stretch));
    gl.uniform1f(u.uSaturation, S.saturation);
    gl.uniform1f(u.uMouseRepulsion, S.mouseRepulsion ? 1 : 0);
    gl.uniform1f(u.uTwinkleIntensity, S.twinkleIntensity);
    gl.uniform1f(u.uRotationAngle, state.angle);
    gl.uniform1f(u.uRepulsionStrength, S.repulsionStrength);
    gl.uniform1f(u.uMouseActiveFactor, state.active);
    gl.uniform1f(u.uAutoCenterRepulsion, S.autoCenterRepulsion);
    gl.uniform1i(u.uLayers, S.layers);
    gl.uniform3fv(u.uColors, colors);
    gl.uniform1i(u.uColorCount, 0);
    gl.uniform1f(u.uWarp, state.boost);
    const fade = Math.min(1, state.reveal / 0.35);
    gl.uniform1f(u.uReveal, fade * fade * (3 - 2 * fade));
    gl.uniform1f(u.uOpacity, S.opacity);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function frame(now) {
    raf = 0;
    if (document.hidden) return;
    if (!fxOn()) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); last = 0; return; }
    const dt = last ? clamp((now - last) / 1000, 0.0005, 0.05) : 1 / 60;
    last = now;
    const motion = reduce ? 0 : 1;
    if (S.intro && !reduce && state.reveal < 1) {
      state.reveal = Math.min(1, state.reveal + dt / INTRO_SECONDS);
      state.boost = Math.max(state.boost, Math.pow(1 - state.reveal, 2) * 1.4);   // 開場：從曲速中減速進入星空
    } else if (!S.intro || reduce) state.reveal = 1;
    const flight = (S.starSpeed / 10) * (S.reverse ? -1 : 1);
    state.time += dt * motion;
    state.gloss += dt * flight * motion;
    const AR = window.worshipAudioReact && window.worshipAudioReact();
    if (AR && AR.beatId !== state.beatSeen) { state.beatSeen = AR.beatId; state.boost = Math.min(0.6, state.boost + 0.12 * AR.beatStrength); }
    state.depth += dt * flight * S.speed * motion * (1 + state.boost * 14) * (AR ? 1 + AR.level * 4 : 1);
    state.angle += dt * S.rotationSpeed * motion;
    state.boost *= Math.exp(-dt * 1.3);
    if (state.boost < 0.001) state.boost = 0;
    const follow = 1 - Math.exp(-dt / 0.325);
    const engaged = S.mouseInteraction && pointer.inside && !reduce;
    if (engaged) { state.mx += (pointer.x - state.mx) * follow; state.my += (pointer.y - state.my) * follow; }
    const target = engaged ? 1 : 0;
    state.active += (target - state.active) * follow;
    if (Math.abs(target - state.active) < 0.001) state.active = target;
    render();
    const busy = motion > 0 || state.boost > 0 || state.active !== target || state.reveal < 1;
    if (busy) raf = requestAnimationFrame(frame); else last = 0;
  }
  const wake = () => { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); };
  // 重新開啟星空時，再播一次「從曲速進入」的開場
  // 提供給「下一則經文」使用：觸發一次曲速推進
  window.worshipGalaxyWarp = () => {
    if (reduce || !fxOn()) return;
    state.boost = Math.min(1.6, state.boost + 1);
    wake();
  };
  window.worshipGalaxyWake = () => { if (!reduce) { state.reveal = 0; } last = 0; wake(); };

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(window.innerWidth * ratio));
    canvas.height = Math.max(1, Math.round(window.innerHeight * ratio));
    if (fxOn()) render();
    wake();
  }
  const locate = e => {
    pointer.inside = e.pointerType === 'mouse' || e.type === 'pointerdown';
    pointer.x = e.clientX / Math.max(1, window.innerWidth);
    pointer.y = 1 - e.clientY / Math.max(1, window.innerHeight);
  };
  // 游標會把附近的星星推開；點擊畫面會以曲速往前衝一下
  window.addEventListener('pointermove', e => { locate(e); wake(); }, { passive: true });
  window.addEventListener('pointerdown', e => {
    locate(e);
    if (!S.clickWarp || reduce || e.target.closest('.dock, .mac-menu')) return;
    state.boost = Math.min(1.6, state.boost + 1);
    wake();
  }, { passive: true });
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer.inside = false; }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { pointer.inside = false; });
  new MutationObserver(() => { if (document.body.classList.contains('idle')) pointer.inside = false; })
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });
  document.addEventListener('visibilitychange', () => { last = 0; wake(); });
  window.addEventListener('resize', resize);
  // 預先編譯會用到的其他變體，避免第一次互動時卡頓
  setTimeout(() => build(false, true), 500);
  resize();
})();
</script>

<script>
// 光束特效（移植自 React Bits LightRays，改為純 JavaScript 版，光色為黃色）
(() => {
  const container = document.getElementById('lightRays');
  const canvas = container.querySelector('canvas');
  const fxOn = () => !window.worshipFx || window.worshipFx.lightrays !== false;

  // ---- 參數（對應原元件的 props） ----
  const S = {
    origin: { anchor: [0.5, -0.2], dir: [0, 1] },   // top-center
    color: [1.0, 0.82, 0.30],                        // 黃色 #ffd14d
    speed: 1,
    spread: 0.5,
    length: 3,
    density: 1,
    tilt: 0,
    sharpness: 0.35,
    glow: 0.6,
    haze: 0.25,
    atmosphere: 0,          // 不往藍色偏，保持純黃
    intensity: 0.9,
    pulsating: false,
    fade: 1,
    saturation: 1,
    follow: false,          // 不跟隨滑鼠
    influence: 0.1,
    cursorShadow: false,    // 不投射游標陰影
    clickPulse: false,      // 點擊畫面不送光波
    noise: 0,
    distortion: 0,
    intro: true,
    opacity: 0.8,
    maxRatio: 2
  };
  const PIXEL_BUDGET = 2.4e6;
  const MAX_PULSES = 4;

  const VERTEX = `#version 300 es
const vec2 corners[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
void main() { gl_Position = vec4(corners[gl_VertexID], 0.0, 1.0); }`;

  const FRAGMENT = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uScale;
uniform float uTime;
uniform vec2 uSource;
uniform vec2 uAim;
uniform float uReach;
uniform vec3 uColor;
uniform float uSpread;
uniform float uLength;
uniform float uFade;
uniform float uSaturation;
uniform float uPulsating;
uniform float uNoise;
uniform float uDistortion;
uniform float uDensity;
uniform float uSharpness;
uniform float uGlow;
uniform float uHaze;
uniform float uAtmosphere;
uniform float uIntensity;
uniform vec4 uShadow;
uniform vec4 uPulses[${MAX_PULSES}];
uniform vec2 uIntro;
uniform float uOpacity;
out vec4 fragColor;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float valueNoise(vec2 p) {
  vec2 i = floor(p); vec2 f = p - i;
  vec2 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), w.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), w.x), w.y);
}
float shape(float strength, float width) {
  float edge = max(mix(0.5, 0.08, uSharpness), width);
  return mix(strength, smoothstep(0.62 - edge, 0.62 + edge, strength), uSharpness);
}
void main() {
  vec2 coord = vec2(gl_FragCoord.x, uResolution.y - gl_FragCoord.y) / uScale;
  vec2 delta = coord - uSource;
  float distance = length(delta);
  vec2 dir = delta / max(distance, 1e-4);
  float cosAngle = dot(dir, uAim);
  float angle = cosAngle + uDistortion * sin(uTime * 2.0 + distance * 0.02) * 0.2;
  float slope = fwidth(angle);
  float depth = distance / uReach;
  float source = exp(-depth * depth * 9.0) * 0.9 + exp(-depth * 3.2) * 0.25;
  float glowLight = uGlow * source * smoothstep(-0.2, 0.6, cosAngle);
  float spread = pow(max(angle, 0.0), 1.0 / uSpread);
  float lengthFalloff = clamp(1.0 - distance / (uReach * uLength), 0.0, 1.0);
  float fadeFalloff = clamp(1.0 - distance / (uReach * uFade), 0.5, 1.0);
  float envelope = spread * lengthFalloff * fadeFalloff;
  float reveal = uIntensity * uIntro.y * (1.0 - smoothstep(uIntro.x - 0.35, uIntro.x, depth));
  if ((envelope * 1.6 + glowLight) * reveal < 0.0015) { fragColor = vec4(0.0); return; }
  float phaseA = angle * 36.2214 * uDensity + uTime * 1.5;
  float phaseB = -angle * 21.11349 * uDensity + uTime * 1.5;
  float phaseC = angle * 22.3991 * uDensity + uTime * 1.1;
  float phaseD = -angle * 18.0234 * uDensity + uTime * 1.1;
  float strengthA = clamp(0.75 + 0.15 * sin(phaseA) + 0.2 * cos(phaseB), 0.0, 1.0);
  float strengthB = clamp(0.75 + 0.15 * sin(phaseC) + 0.2 * cos(phaseD), 0.0, 1.0);
  float widthA = abs(0.15 * 36.2214 * cos(phaseA) + 0.2 * 21.11349 * sin(phaseB)) * uDensity * slope;
  float widthB = abs(0.15 * 22.3991 * cos(phaseC) + 0.2 * 18.0234 * sin(phaseD)) * uDensity * slope;
  float pulseA = uPulsating > 0.5 ? 0.8 + 0.2 * sin(uTime * 4.5) : 1.0;
  float pulseB = uPulsating > 0.5 ? 0.8 + 0.2 * sin(uTime * 3.3) : 1.0;
  float rayLight = envelope * (0.5 * shape(strengthA, widthA) * pulseA + 0.4 * shape(strengthB, widthB) * pulseB);
  if (uHaze > 0.0) {
    float around = atan(uAim.x * dir.y - uAim.y * dir.x, cosAngle);
    vec2 drift = vec2(around * 2.2 + uTime * 0.035, depth * 2.6 - uTime * 0.11);
    float fog = 0.65 * valueNoise(drift * vec2(3.0, 1.0)) + 0.35 * valueNoise(drift * vec2(7.0, 2.3) + 4.1);
    rayLight *= mix(1.0, 0.25 + 1.2 * fog, uHaze);
  }
  if (uShadow.z > 0.0) {
    vec2 toCursor = uShadow.xy - uSource;
    float cursorDistance = length(toCursor);
    float along = dot(delta, toCursor) / max(cursorDistance * cursorDistance, 1e-4);
    float side = abs(delta.x * toCursor.y - delta.y * toCursor.x) / max(cursorDistance, 1e-4);
    float trail = max(along - 1.0, 0.0);
    float width = uShadow.w * along + 0.22 * trail * cursorDistance;
    float behind = smoothstep(0.97, 1.25, along) * exp(-trail * 1.1);
    float shade = (1.0 - smoothstep(width * 0.3, width * 1.6, side)) * behind;
    rayLight *= 1.0 - uShadow.z * 0.62 * shade;
  }
  float boost = 0.0;
  for (int i = 0; i < ${MAX_PULSES}; i++) {
    vec4 wave = uPulses[i];
    if (wave.z <= 0.0) continue;
    float x = (depth - wave.x) / wave.y;
    boost += wave.z * exp(-x * x);
  }
  float light = (rayLight * (1.0 + boost) + glowLight) * reveal;
  if (uNoise > 0.0) {
    float n = fract(sin(dot(coord * 0.02 + uTime * 0.1, vec2(12.9898, 78.233))) * 43758.5453123);
    light *= 1.0 - uNoise + uNoise * n;
  }
  float near = clamp(1.2 - distance / (uResolution.y / uScale), 0.0, 1.0);
  vec3 tint = mix(vec3(0.9), vec3(0.1, 0.3, 0.5) + near * vec3(0.8, 0.6, 0.5), uAtmosphere);
  float gray = dot(tint, vec3(0.299, 0.587, 0.114));
  vec3 hue = max(mix(vec3(gray), tint, uSaturation), 0.0) * uColor;
  float grain = (fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) - 0.5) / 255.0;
  float level = light < 0.75 ? light : 0.75 + 0.25 * (1.0 - exp(-(light - 0.75) / 0.25));
  float top = max(hue.r, max(hue.g, hue.b));
  hue = mix(hue, vec3(top), smoothstep(0.8, 1.0, level) * 0.45);
  vec3 shown = clamp(hue * level, 0.0, 1.0) * level;
  fragColor = vec4(clamp(shown + grain, 0.0, level) * uOpacity, level * uOpacity);
}`;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const smoother = t => { const x = clamp(t, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };

  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
  if (!gl) { container.hidden = true; return; }   // 不支援 WebGL2 的瀏覽器就不顯示此特效

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); return null; }
    return sh;
  }
  const vs = compile(gl.VERTEX_SHADER, VERTEX), fs = compile(gl.FRAGMENT_SHADER, FRAGMENT);
  if (!vs || !fs) { container.hidden = true; return; }
  const program = gl.createProgram();
  gl.attachShader(program, vs); gl.attachShader(program, fs); gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) { container.hidden = true; return; }
  const u = {};
  for (let n = 0, c = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); n < c; n++) {
    const info = gl.getActiveUniform(program, n);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(program, info.name);
  }
  const vao = gl.createVertexArray();

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const size = { width: 1, height: 1, ratio: 1 };
  const pointer = { x: 0.5, y: 0.5, inside: false, seen: false };
  const aim = { x: 0.5, y: 0.5 };
  const shade = { x: 0.5, y: 0.5, presence: 0 };
  const pulses = [];
  const pulseData = new Float32Array(MAX_PULSES * 4);
  let time = 0, opening = S.intro && !reduced ? 0 : 1, raf = 0, last = 0;
  let pageVisible = document.visibilityState !== 'hidden';

  function resize() {
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const detail = S.density * (0.35 + 0.65 * S.sharpness);
    const sampling = Math.max(clamp(0.35 + 0.3 * detail, 0.5, 2), S.noise > 0 ? 1 : 0);
    const ratio = Math.min(window.devicePixelRatio || 1, S.maxRatio, sampling, Math.sqrt(PIXEL_BUDGET / (cw * ch)));
    const w = Math.max(1, Math.round(cw * ratio)), h = Math.max(1, Math.round(ch * ratio));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    size.width = cw; size.height = ch; size.ratio = w / cw;
  }

  function frame(now) {
    raf = 0;
    if (!fxOn()) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); return; }
    const dt = clamp((now - last) / 1000 || 0, 0, 0.05);
    last = Math.max(last, now);
    time += dt * S.speed * (reduced ? 0.35 : 1);
    if (opening < 1) opening = Math.min(1, opening + dt / 1.8);

    const steer = 1 - Math.exp(-dt / 0.2);
    const aimX = S.follow && pointer.seen ? pointer.x : 0.5;
    const aimY = S.follow && pointer.seen ? pointer.y : 0.5;
    aim.x += (aimX - aim.x) * steer;
    aim.y += (aimY - aim.y) * steer;
    const glide = 1 - Math.exp(-dt / 0.08);
    shade.x += (pointer.x - shade.x) * glide;
    shade.y += (pointer.y - shade.y) * glide;
    const shading = pointer.inside && S.cursorShadow && !reduced;
    shade.presence += ((shading ? 1 : 0) - shade.presence) * (1 - Math.exp(-dt / (shading ? 0.25 : 0.5)));

    for (let n = pulses.length - 1; n >= 0; n--) { pulses[n].age += dt; if (pulses[n].age >= 2) pulses.splice(n, 1); }
    pulseData.fill(0);
    pulses.forEach((p, n) => {
      const t = p.age;
      pulseData[n * 4] = 0.05 + t * 1.05;
      pulseData[n * 4 + 1] = 0.14 + t * 0.14;
      pulseData[n * 4 + 2] = 0.9 * smoother(t / 0.15) * (1 - smoother(t / 2));
    });

    const W = size.width, H = size.height;
    const sx = S.origin.anchor[0] * W, sy = S.origin.anchor[1] * H;
    const cos = Math.cos(S.tilt), sin = Math.sin(S.tilt);
    let dx = S.origin.dir[0] * cos - S.origin.dir[1] * sin;
    let dy = S.origin.dir[0] * sin + S.origin.dir[1] * cos;
    if (S.follow && S.influence > 0) {
      const mx = aim.x * W - sx, my = aim.y * H - sy, ml = Math.hypot(mx, my) || 1;
      const bx = dx + (mx / ml - dx) * S.influence, by = dy + (my / ml - dy) * S.influence, bl = Math.hypot(bx, by) || 1;
      dx = bx / bl; dy = by / bl;
    }
    const eased = 1 - Math.pow(1 - opening, 3);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);
    gl.bindVertexArray(vao);
    gl.uniform2f(u.uResolution, canvas.width, canvas.height);
    gl.uniform1f(u.uScale, size.ratio);
    gl.uniform1f(u.uTime, time);
    gl.uniform2f(u.uSource, sx, sy);
    gl.uniform2f(u.uAim, dx, dy);
    gl.uniform1f(u.uReach, Math.max(W, H));
    gl.uniform3f(u.uColor, S.color[0], S.color[1], S.color[2]);
    gl.uniform1f(u.uSpread, S.spread);
    gl.uniform1f(u.uLength, S.length);
    gl.uniform1f(u.uFade, S.fade);
    gl.uniform1f(u.uSaturation, S.saturation);
    gl.uniform1f(u.uPulsating, S.pulsating ? 1 : 0);
    gl.uniform1f(u.uNoise, S.noise);
    gl.uniform1f(u.uDistortion, S.distortion);
    gl.uniform1f(u.uDensity, S.density);
    gl.uniform1f(u.uSharpness, S.sharpness);
    gl.uniform1f(u.uGlow, S.glow);
    gl.uniform1f(u.uHaze, S.haze);
    gl.uniform1f(u.uAtmosphere, S.atmosphere);
    const AR = window.worshipAudioReact && window.worshipAudioReact();
    if (AR && AR.beatId !== frame.beatSeen) {
      frame.beatSeen = AR.beatId;
      if (AR.beatStrength > 0.35 && !reduced) { pulses.push({ age: 0 }); if (pulses.length > MAX_PULSES) pulses.shift(); }
    }
    gl.uniform1f(u.uIntensity, S.intensity * (AR ? 1 + AR.bass * 0.9 : 1));
    gl.uniform4f(u.uShadow, shade.x * W, shade.y * H, shade.presence, 16);
    gl.uniform4fv(u.uPulses, pulseData);
    gl.uniform2f(u.uIntro, eased * 2.6, smoother(opening / 0.5));
    gl.uniform1f(u.uOpacity, S.opacity);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (pageVisible) raf = requestAnimationFrame(frame);
  }
  function wake() {
    if (raf || !pageVisible) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  // 提供給「下一則經文」使用：沿光束送出一道光波
  window.worshipLightRaysPulse = () => {
    if (reduced || !fxOn()) return;
    pulses.push({ age: 0 });
    if (pulses.length > MAX_PULSES) pulses.shift();
    wake();
  };
  window.worshipLightRaysWake = () => { opening = reduced ? 1 : 0; wake(); };   // 重新開啟時再播一次光束展開

  // 光束微微轉向游標；游標會在光束中投下柔和陰影；點擊送出一道光波
  const onMove = e => {
    const x = e.clientX / size.width, y = e.clientY / size.height;
    if (!pointer.inside) { shade.x = x; shade.y = y; }
    pointer.x = x; pointer.y = y; pointer.inside = e.pointerType === 'mouse'; pointer.seen = true;
    wake();
  };
  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerdown', e => {
    onMove(e);
    if (!S.clickPulse || reduced || e.target.closest('.dock, .mac-menu')) return;
    pulses.push({ age: 0 });
    if (pulses.length > MAX_PULSES) pulses.shift();
  }, { passive: true });
  const leave = () => { pointer.inside = false; };
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') leave(); }, { passive: true });
  document.documentElement.addEventListener('pointerleave', leave);
  // 游標閒置隱藏時，陰影也一起淡掉
  new MutationObserver(() => { if (document.body.classList.contains('idle')) leave(); })
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });
  window.addEventListener('resize', () => { resize(); wake(); });
  document.addEventListener('visibilitychange', () => { pageVisible = document.visibilityState !== 'hidden'; wake(); });
  resize();
  wake();
})();
</script>
